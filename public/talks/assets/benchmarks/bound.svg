<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="500" viewBox="0 0 1280 500" role="img">
<title>Twenty independent representative trials, zero failures</title>
<rect width="1280" height="500" fill="#161d26"/>
<text x="45" y="60" fill="#efb45f" font-family="Arial,sans-serif" font-size="30">Twenty independent representative trials, zero failures</text>
<path d="M45 158 H1230" stroke="#53606d"/>
<text x="45" y="135" fill="#efb45f" font-family="Arial,sans-serif" font-size="29">Approximate</text>
<text x="400" y="135" fill="#f5f1e9" font-family="Arial,sans-serif" font-size="27">95% upper bound ≈ 3 / 20 = 15%</text>
<path d="M45 233 H1230" stroke="#53606d"/>
<text x="45" y="210" fill="#efb45f" font-family="Arial,sans-serif" font-size="29">Exact</text>
<text x="400" y="210" fill="#f5f1e9" font-family="Arial,sans-serif" font-size="27">1 − 0.05^(1/20) = 13.91%</text>
<path d="M45 308 H1230" stroke="#53606d"/>
<text x="45" y="285" fill="#efb45f" font-family="Arial,sans-serif" font-size="29">Scale</text>
<text x="400" y="285" fill="#f5f1e9" font-family="Arial,sans-serif" font-size="27">About one failure in seven</text>
<path d="M45 383 H1230" stroke="#53606d"/>
<text x="45" y="360" fill="#efb45f" font-family="Arial,sans-serif" font-size="29">Assumption</text>
<text x="400" y="360" fill="#f5f1e9" font-family="Arial,sans-serif" font-size="27">IID sampling from the population of interest</text>
<path d="M45 458 H1230" stroke="#53606d"/>
<text x="45" y="435" fill="#efb45f" font-family="Arial,sans-serif" font-size="29">Incident handpicks</text>
<text x="400" y="435" fill="#f5f1e9" font-family="Arial,sans-serif" font-size="27">Useful regressions; no population-rate bound</text>
</svg>
