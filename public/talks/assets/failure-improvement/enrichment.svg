<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="500" viewBox="0 0 1280 500" role="img"><title>Enrichment ladder: logs, code, trace, reproduction, ticket</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#efb45f"/></marker></defs><rect width="1280" height="500" fill="#161d26"/><text x="35" y="45" fill="#efb45f" font-family="Arial" font-size="30">Add the integration that answers the next question</text>
<path d="M240 380 H260 V322 H278" fill="none" stroke="#efb45f" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="35" y="335" width="205" height="90" rx="5" fill="#24313d" stroke="#778591"/><text x="49" y="369" fill="#efb45f" font-family="Arial" font-size="28">Logs</text><text x="49" y="401" fill="#f5f1e9" font-family="Arial" font-size="20">What failed?</text>
<path d="M485 322 H505 V264 H523" fill="none" stroke="#efb45f" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="280" y="277" width="205" height="90" rx="5" fill="#24313d" stroke="#778591"/><text x="294" y="311" fill="#efb45f" font-family="Arial" font-size="28">Code</text><text x="294" y="343" fill="#f5f1e9" font-family="Arial" font-size="20">Which branch?</text>
<path d="M730 264 H750 V206 H768" fill="none" stroke="#efb45f" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="525" y="219" width="205" height="90" rx="5" fill="#24313d" stroke="#778591"/><text x="539" y="253" fill="#efb45f" font-family="Arial" font-size="28">Trace</text><text x="539" y="285" fill="#f5f1e9" font-family="Arial" font-size="20">What came before?</text>
<path d="M975 206 H995 V148 H1013" fill="none" stroke="#efb45f" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="770" y="161" width="205" height="90" rx="5" fill="#24313d" stroke="#778591"/><text x="784" y="195" fill="#efb45f" font-family="Arial" font-size="28">Reproduce</text><text x="784" y="227" fill="#f5f1e9" font-family="Arial" font-size="20">Does the cause hold?</text>
<rect x="1015" y="103" width="205" height="90" rx="5" fill="#24313d" stroke="#778591"/><text x="1029" y="137" fill="#efb45f" font-family="Arial" font-size="28">Ticket</text><text x="1029" y="169" fill="#f5f1e9" font-family="Arial" font-size="20">Who can act?</text>
<text x="390" y="455" fill="#f5f1e9" font-family="Arial" font-size="25">One failure class. Separate grants. A place to stop.</text></svg>
