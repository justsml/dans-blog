<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="500" viewBox="0 0 1280 500" role="img">
<title>The bookmark follows the artifact</title>
<rect width="1280" height="500" fill="#161d26"/>
<text x="45" y="60" fill="#efb45f" font-family="Arial,sans-serif" font-size="30">The bookmark follows the artifact</text>
<path d="M45 158 H1230" stroke="#53606d"/>
<text x="45" y="135" fill="#efb45f" font-family="Arial,sans-serif" font-size="29">1 · Read</text>
<text x="400" y="135" fill="#f5f1e9" font-family="Arial,sans-serif" font-size="27">Last completed bookmark + bounded window</text>
<path d="M45 233 H1230" stroke="#53606d"/>
<text x="45" y="210" fill="#efb45f" font-family="Arial,sans-serif" font-size="29">2 · Distill</text>
<text x="400" y="210" fill="#f5f1e9" font-family="Arial,sans-serif" font-size="27">Redact, group, retain evidence IDs</text>
<path d="M45 308 H1230" stroke="#53606d"/>
<text x="45" y="285" fill="#efb45f" font-family="Arial,sans-serif" font-size="29">3 · Save</text>
<text x="400" y="285" fill="#f5f1e9" font-family="Arial,sans-serif" font-size="27">Durable artifact + stable incident keys</text>
<path d="M45 383 H1230" stroke="#53606d"/>
<text x="45" y="360" fill="#efb45f" font-family="Arial,sans-serif" font-size="29">4 · Advance</text>
<text x="400" y="360" fill="#f5f1e9" font-family="Arial,sans-serif" font-size="27">Move bookmark only after save</text>
<path d="M45 458 H1230" stroke="#53606d"/>
<text x="45" y="435" fill="#efb45f" font-family="Arial,sans-serif" font-size="29">5 · Route</text>
<text x="400" y="435" fill="#f5f1e9" font-family="Arial,sans-serif" font-size="27">Retry ticket writes from the saved artifact</text>
</svg>
