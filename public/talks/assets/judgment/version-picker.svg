<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="500" viewBox="0 0 1280 500"><title>A settings panel where version sits beside theme and language</title><rect width="1280" height="500" fill="#161d26"/><text x="70" y="44" font-family="Arial,sans-serif" font-size="26" fill="#f5f1e9">Settings</text><text x="70" y="74" font-family="Arial,sans-serif" font-size="22" fill="#9cabb8">Two of these already exist. The third is the prediction.</text><rect x="70" y="100" width="1140" height="330" rx="14" fill="#1d2733" stroke="#2b3644" stroke-width="2"/><text x="110" y="165" font-family="Arial,sans-serif" font-size="26" fill="#9cabb8">Theme</text><rect x="420" y="133" width="240" height="46" rx="8" fill="#161d26" stroke="#2b3644" stroke-width="2"/><text x="444" y="165" font-family="Arial,sans-serif" font-size="24" fill="#9cabb8">Dark</text><line x1="110" y1="195" x2="1170" y2="195" stroke="#2b3644" stroke-width="1"/><text x="110" y="245" font-family="Arial,sans-serif" font-size="26" fill="#9cabb8">Language</text><rect x="420" y="213" width="240" height="46" rx="8" fill="#161d26" stroke="#2b3644" stroke-width="2"/><text x="444" y="245" font-family="Arial,sans-serif" font-size="24" fill="#9cabb8">English</text><line x1="110" y1="275" x2="1170" y2="275" stroke="#2b3644" stroke-width="1"/><rect x="86" y="288" width="1108" height="126" rx="10" fill="#efb45f" fill-opacity="0.10"/><text x="110" y="330" font-family="Arial,sans-serif" font-size="26" fill="#efb45f">Version</text><rect x="420" y="298" width="240" height="46" rx="8" fill="#161d26" stroke="#efb45f" stroke-width="2"/><text x="444" y="330" font-family="Arial,sans-serif" font-size="24" fill="#f5f1e9">4.2</text><text x="690" y="330" font-family="Arial,sans-serif" font-size="24" fill="#9cabb8">43 days old</text><rect x="880" y="298" width="150" height="46" rx="8" fill="#161d26" stroke="#2b3644" stroke-width="2"/><text x="955" y="329" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#9cabb8">What changed</text><rect x="1044" y="298" width="126" height="46" rx="8" fill="#efb45f"/><text x="1107" y="329" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#161d26">Update</text><rect x="110" y="366" width="70" height="34" rx="17" fill="#161d26" stroke="#2b3644" stroke-width="2"/><circle cx="130" cy="383" r="12" fill="#9cabb8"/><text x="200" y="392" font-family="Arial,sans-serif" font-size="24" fill="#9cabb8">Auto-update  —  off. She lands on the version she left.</text><text x="70" y="470" font-family="Arial,sans-serif" font-size="24" fill="#f5f1e9">Change stops happening to her while she was away, and becomes something she asks for.</text></svg>