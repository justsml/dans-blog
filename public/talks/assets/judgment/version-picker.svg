<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="500" viewBox="0 0 1280 500">
  <title>A settings panel where version sits beside theme and language</title>

  <rect width="1280" height="500" fill="#161d26"/>

  <!-- Window chrome -->
  <text x="70" y="56" font-family="Arial,sans-serif" font-size="30" fill="#f5f1e9">Settings</text>
  <rect x="70" y="90" width="1140" height="340" rx="14" fill="#1d2733" stroke="#2b3644" stroke-width="2"/>

  <!-- Theme -->
  <text x="110" y="157" font-family="Arial,sans-serif" font-size="26" fill="#9cabb8">Theme</text>
  <rect x="420" y="126" width="240" height="46" rx="8" fill="#161d26" stroke="#2b3644" stroke-width="2"/>
  <text x="444" y="157" font-family="Arial,sans-serif" font-size="24" fill="#f5f1e9">Dark</text>
  <line x1="110" y1="196" x2="1170" y2="196" stroke="#2b3644" stroke-width="1"/>

  <!-- Language -->
  <text x="110" y="247" font-family="Arial,sans-serif" font-size="26" fill="#9cabb8">Language</text>
  <rect x="420" y="216" width="240" height="46" rx="8" fill="#161d26" stroke="#2b3644" stroke-width="2"/>
  <text x="444" y="247" font-family="Arial,sans-serif" font-size="24" fill="#f5f1e9">English</text>
  <line x1="110" y1="286" x2="1170" y2="286" stroke="#2b3644" stroke-width="1"/>

  <!-- Version: the row that does not exist yet -->
  <rect x="86" y="300" width="1108" height="114" rx="10" fill="#efb45f" fill-opacity="0.10"/>

  <text x="110" y="347" font-family="Arial,sans-serif" font-size="26" fill="#efb45f">Version</text>
  <rect x="420" y="316" width="140" height="46" rx="8" fill="#161d26" stroke="#efb45f" stroke-width="2"/>
  <text x="444" y="347" font-family="Arial,sans-serif" font-size="24" fill="#f5f1e9">4.2</text>
  <text x="590" y="347" font-family="Arial,sans-serif" font-size="24" fill="#9cabb8">42 days old</text>

  <rect x="860" y="316" width="170" height="46" rx="8" fill="#161d26" stroke="#2b3644" stroke-width="2"/>
  <text x="945" y="346" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#9cabb8">What changed</text>

  <rect x="1046" y="316" width="124" height="46" rx="8" fill="#efb45f"/>
  <text x="1108" y="346" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#161d26">Update</text>

  <!-- Auto-update, shown off -->
  <text x="110" y="397" font-family="Arial,sans-serif" font-size="24" fill="#9cabb8">Auto-update</text>
  <rect x="420" y="372" width="70" height="34" rx="17" fill="#161d26" stroke="#2b3644" stroke-width="2"/>
  <circle cx="440" cy="389" r="12" fill="#9cabb8"/>
  <text x="510" y="397" font-family="Arial,sans-serif" font-size="22" fill="#9cabb8">Off</text>
</svg>
