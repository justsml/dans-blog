<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 500" role="img" aria-labelledby="title desc"><title id="title">Conjure the agent the job needs</title><desc id="desc">The orchestrator writes a tailored prompt, selects the minimum tools from a catalog, and loops until the job is done or must stop.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#a4d2c4"/></marker><marker id="deny" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#e08a7a"/></marker></defs><rect x="20" y="50" width="370" height="250" rx="3" fill="none" stroke="#a4d2c4" stroke-width="3"/><text x="42" y="96" font-family="Arial, Helvetica, sans-serif" font-size="32" fill="#a4d2c4">Orchestrator</text><text x="42" y="144" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#f5f1e9">Reads the failure</text><text x="42" y="180" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#f5f1e9">Writes the job contract</text><text x="42" y="216" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#f5f1e9">Generates one agent</text><text x="42" y="252" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#f5f1e9">Loops: done, more, or stop</text><path d="M390,175 L448,175" fill="none" stroke="#a4d2c4" stroke-width="3" marker-end="url(#arrow)"/><rect x="468" y="50" width="370" height="250" rx="3" fill="none" stroke="#728482" stroke-width="1.5"/><text x="490" y="96" font-family="Arial, Helvetica, sans-serif" font-size="32" fill="#f5f1e9">Generated agent</text><text x="490" y="144" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#bec9c6">Prompt written for this failure</text><text x="490" y="180" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#bec9c6">Tools: read-sample, read-contract</text><text x="490" y="216" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#bec9c6">$2 · 120 s · 3 attempts</text><text x="490" y="252" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#bec9c6">Discarded when finished</text><text x="877" y="122" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#a4d2c4" text-anchor="middle">asks</text><path d="M838,140 L906,140" fill="none" stroke="#a4d2c4" stroke-width="3" marker-end="url(#arrow)"/><text x="877" y="232" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#e08a7a" text-anchor="middle">denied</text><path d="M906,210 L848,210" fill="none" stroke="#e08a7a" stroke-width="3" marker-end="url(#deny)"/><rect x="916" y="50" width="344" height="250" rx="3" fill="none" stroke="#728482" stroke-width="1.5"/><text x="938" y="96" font-family="Arial, Helvetica, sans-serif" font-size="32" fill="#f5f1e9">Tool policy gate</text><text x="938" y="144" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#a4d2c4">read-sample · granted</text><text x="938" y="180" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#a4d2c4">run-fixtures · granted</text><text x="938" y="216" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#e08a7a">write-database · denied</text><text x="938" y="252" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#bec9c6">Every answer logged</text><path d="M653,300 L653,345 L205,345 L205,305" fill="none" stroke="#a4d2c4" stroke-width="2" stroke-dasharray="8 8" marker-end="url(#arrow)"/><text x="429" y="336" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#a4d2c4" text-anchor="middle">result → evaluate → next specialist, or stop</text><text x="20" y="412" font-family="Arial, Helvetica, sans-serif" font-size="27" fill="#f5f1e9">Unfamiliar failure: diff agent → fixture agent → reviewer, each with its own blast radius.</text><text x="20" y="452" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#bec9c6">Known mapping: run the tested code. Conjure nothing.</text></svg>
