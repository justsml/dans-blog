<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 500" role="img" aria-labelledby="title desc"><title id="title">A successful response can break ingest</title><desc id="desc">HTTP success does not establish that the payload still matches your contract.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#a4d2c4"/></marker></defs><text x="20" y="45" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#a4d2c4" text-anchor="start">YESTERDAY</text><text x="670" y="45" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#a4d2c4" text-anchor="start">TODAY</text><rect x="20" y="75" width="530" height="180" rx="3" fill="none" stroke="#728482" stroke-width="1.5"/><text x="40" y="119" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#f5f1e9" text-anchor="start">HTTP 200</text><text x="40" y="163" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#bec9c6" text-anchor="start">zip: &quot;02108&quot;</text><text x="40" y="201" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#bec9c6" text-anchor="start">country: &quot;US&quot;</text><rect x="670" y="75" width="590" height="180" rx="3" fill="none" stroke="#a4d2c4" stroke-width="3"/><text x="690" y="119" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#a4d2c4" text-anchor="start">HTTP 200</text><text x="690" y="163" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#bec9c6" text-anchor="start">postal_code: &quot;02108&quot;</text><text x="690" y="201" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#bec9c6" text-anchor="start">country: &quot;US&quot;</text><path d="M570,165 L645,165" fill="none" stroke="#a4d2c4" stroke-width="3" marker-end="url(#arrow)"/><text x="20" y="330" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#f5f1e9" text-anchor="start">Known adapter accepts the field</text><text x="670" y="330" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#f5f1e9" text-anchor="start">Known adapter cannot find zip</text><text x="20" y="470" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#bec9c6" text-anchor="start">HTTP success does not establish that the payload still matches your contract.</text></svg>
