<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 500" role="img" aria-labelledby="title desc"><title id="title">Three events require three decisions</title><desc id="desc">Recovery, quarantine and reconciliation are all legitimate outcomes of the same ingest job.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#a4d2c4"/></marker></defs><rect x="20" y="20" width="420" height="115" rx="3" fill="none" stroke="#728482" stroke-width="1.5"/><text x="40" y="64" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#f5f1e9" text-anchor="start">Documented rename</text><path d="M460,78 L540,78" fill="none" stroke="#a4d2c4" stroke-width="3" marker-end="url(#arrow)"/><rect x="560" y="20" width="700" height="115" rx="3" fill="none" stroke="#a4d2c4" stroke-width="3"/><text x="580" y="64" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#a4d2c4" text-anchor="start">Canary mapping</text><text x="580" y="108" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#bec9c6" text-anchor="start">Evidence and fixtures pass</text><rect x="20" y="160" width="420" height="115" rx="3" fill="none" stroke="#728482" stroke-width="1.5"/><text x="40" y="204" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#f5f1e9" text-anchor="start">Unknown status</text><path d="M460,218 L540,218" fill="none" stroke="#a4d2c4" stroke-width="3" marker-end="url(#arrow)"/><rect x="560" y="160" width="700" height="115" rx="3" fill="none" stroke="#a4d2c4" stroke-width="3"/><text x="580" y="204" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#a4d2c4" text-anchor="start">Quarantine</text><text x="580" y="248" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#bec9c6" text-anchor="start">Ask for business semantics</text><rect x="20" y="300" width="420" height="115" rx="3" fill="none" stroke="#728482" stroke-width="1.5"/><text x="40" y="344" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#f5f1e9" text-anchor="start">Lost response</text><path d="M460,358 L540,358" fill="none" stroke="#a4d2c4" stroke-width="3" marker-end="url(#arrow)"/><rect x="560" y="300" width="700" height="115" rx="3" fill="none" stroke="#a4d2c4" stroke-width="3"/><text x="580" y="344" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#a4d2c4" text-anchor="start">Reconcile</text><text x="580" y="388" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#bec9c6" text-anchor="start">Preserve the uncertain operation</text><text x="20" y="470" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#bec9c6" text-anchor="start">Recovery, quarantine and reconciliation are all legitimate outcomes of the same ingest job.</text></svg>
