<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 500" role="img" aria-labelledby="title desc"><title id="title">A lost response leaves an unknown outcome</title><desc id="desc">Reconcile the operation identity before another submission; retain unresolved reservations.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#a4d2c4"/></marker></defs><text x="20" y="55" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#a4d2c4" text-anchor="start">APPLICATION</text><text x="800" y="55" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#a4d2c4" text-anchor="start">PROVIDER</text><path d="M130,135 L1080,135" fill="none" stroke="#a4d2c4" stroke-width="3" marker-end="url(#arrow)"/><text x="330" y="110" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#f5f1e9" text-anchor="start">Submit with operation identity</text><text x="800" y="215" font-family="Arial, Helvetica, sans-serif" font-size="27" fill="#f5f1e9" text-anchor="start">Accepted. Work may be billable.</text><path d="M1080,275 L160,275" fill="none" stroke="#a4d2c4" stroke-width="3" marker-end="url(#arrow)" stroke-dasharray="9 7"/><text x="370" y="255" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#a4d2c4" text-anchor="start">Response lost</text><text x="20" y="360" font-family="Arial, Helvetica, sans-serif" font-size="33" fill="#f5f1e9" text-anchor="start">Local timeout ≠ confirmed failure</text><text x="20" y="470" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#bec9c6" text-anchor="start">Reconcile the operation identity before another submission; retain unresolved reservations.</text></svg>
