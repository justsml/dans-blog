<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 500" role="img" aria-labelledby="title desc"><title id="title">Monkeys, then guards</title><desc id="desc">Cheap parallel generation produces candidates; shared gates reject before preference; cheap multi-model judges report disagreement rather than an average score.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#efb45f"/></marker></defs><text x="20" y="34" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#efb45f" text-anchor="start">BARREL OF MONKEYS · GENERATE IN PARALLEL WITH A DECLARED BUDGET</text><rect x="20" y="52" width="390" height="94" rx="3" fill="none" stroke="#efb45f" stroke-width="3"/><text x="40" y="90" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#efb45f" text-anchor="start">Minimalist</text><text x="40" y="126" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#bec9c6" text-anchor="start">Smallest adequate scope</text><rect x="445" y="52" width="390" height="94" rx="3" fill="none" stroke="#efb45f" stroke-width="3"/><text x="465" y="90" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#efb45f" text-anchor="start">Maintainer</text><text x="465" y="126" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#bec9c6" text-anchor="start">Recoverable state</text><rect x="870" y="52" width="390" height="94" rx="3" fill="none" stroke="#efb45f" stroke-width="3"/><text x="890" y="90" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#efb45f" text-anchor="start">Security / perf</text><text x="890" y="126" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#bec9c6" text-anchor="start">Limits and failure cases</text><path d="M215,150 L215,178" stroke="#efb45f" stroke-width="3" marker-end="url(#arrow)"/><path d="M640,150 L640,178" stroke="#efb45f" stroke-width="3" marker-end="url(#arrow)"/><path d="M1065,150 L1065,178" stroke="#efb45f" stroke-width="3" marker-end="url(#arrow)"/><rect x="20" y="186" width="1240" height="66" rx="3" fill="none" stroke="#bec9c6" stroke-width="3" stroke-dasharray="9 6"/><text x="40" y="216" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#f5f1e9" text-anchor="start">GATES BEFORE PREFERENCES — written before any candidate is read</text><text x="40" y="243" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#bec9c6" text-anchor="start">no duplicate dispatch after restart · no cross-tenant spend · no regeneration on retry · no dispatch after deadline</text><text x="20" y="296" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#efb45f" text-anchor="start">COUNCIL OF GUARDS · SAME-RATE EXAMPLE: FIVE VERDICTS 1.025¢ · DRAFT 0.78¢</text><rect x="52" y="316" width="26" height="26" fill="#efb45f"/><rect x="102" y="316" width="26" height="26" fill="#efb45f"/><rect x="152" y="316" width="26" height="26" fill="#efb45f"/><rect x="202" y="316" width="26" height="26" fill="#efb45f"/><rect x="252" y="316" width="26" height="26" fill="#efb45f"/><text x="40" y="378" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#f5f1e9" text-anchor="start">Judges agree</text><text x="40" y="408" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#bec9c6" text-anchor="start">failed a gate, same reason</text><rect x="477" y="316" width="26" height="26" fill="#efb45f"/><rect x="527" y="326" width="26" height="26" fill="#bec9c6"/><rect x="577" y="316" width="26" height="26" fill="#f5f1e9"/><rect x="627" y="326" width="26" height="26" fill="#bec9c6"/><rect x="677" y="316" width="26" height="26" fill="#f5f1e9"/><text x="465" y="378" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#f5f1e9" text-anchor="start">Five judges, split</text><text x="465" y="408" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#bec9c6" text-anchor="start">reasons barely overlap</text><rect x="902" y="316" width="26" height="26" fill="#efb45f"/><rect x="952" y="316" width="26" height="26" fill="#efb45f"/><rect x="1002" y="316" width="26" height="26" fill="#efb45f"/><rect x="1052" y="316" width="26" height="26" fill="#efb45f"/><rect x="1102" y="316" width="26" height="26" fill="#efb45f"/><text x="890" y="378" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#f5f1e9" text-anchor="start">Judges agree</text><text x="890" y="408" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#bec9c6" text-anchor="start">replay bug, same reason</text><rect x="445" y="306" width="390" height="120" rx="3" fill="none" stroke="#f5f1e9" stroke-width="3"/><text x="20" y="470" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#f5f1e9" text-anchor="start">Not the average score. The disagreement. A synthesis is a new candidate and runs the gates again.</text></svg>
