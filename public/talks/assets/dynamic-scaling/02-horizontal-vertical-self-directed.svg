<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 500" role="img" aria-labelledby="title desc"><title id="title">Horizontal, vertical, and self-directed</title><desc id="desc">Ops sized the fleet for everyone; an autoscaler reacts to CPU; an agentic job describes its own shape and asks.</desc><text x="20" y="44" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#bec9c6" letter-spacing="3">HORIZONTAL</text><rect x="20" y="70" width="64" height="64" fill="none" stroke="#728482" stroke-width="1.5"/><rect x="98" y="70" width="64" height="64" fill="none" stroke="#728482" stroke-width="1.5"/><rect x="176" y="70" width="64" height="64" fill="none" stroke="#728482" stroke-width="1.5"/><rect x="254" y="70" width="64" height="64" fill="none" stroke="#728482" stroke-width="1.5" stroke-dasharray="6 6"/><text x="20" y="184" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#f5f1e9">More boxes.</text><text x="20" y="214" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#bec9c6">Decided by ops.</text><text x="20" y="242" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#bec9c6">Sized for the worst Tuesday.</text><text x="440" y="44" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#bec9c6" letter-spacing="3">VERTICAL</text><rect x="440" y="70" width="64" height="64" fill="none" stroke="#728482" stroke-width="1.5"/><rect x="524" y="60" width="110" height="110" fill="none" stroke="#728482" stroke-width="1.5" stroke-dasharray="6 6"/><text x="440" y="214" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#f5f1e9">A bigger box.</text><text x="440" y="244" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#bec9c6">Decided by ops.</text><text x="440" y="272" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#bec9c6">An autoscaler watches CPU and guesses.</text><text x="860" y="44" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#efb45f" letter-spacing="3">SELF-DIRECTED</text><rect x="860" y="60" width="400" height="150" rx="3" fill="none" stroke="#efb45f" stroke-width="3"/><text x="882" y="104" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#f5f1e9">The job says what it is</text><text x="882" y="144" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#bec9c6">I/O wait · 8 workers · 6 minutes</text><text x="882" y="178" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#bec9c6">GPU · 90 seconds · sandboxed</text><text x="860" y="244" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#efb45f">Decided per job, the moment it starts.</text><line x1="20" y1="306" x2="1260" y2="306" stroke="#728482" stroke-width="1"/><text x="20" y="350" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#bec9c6" letter-spacing="3">THREE DECISIONS STAY SEPARATE</text><text x="20" y="396" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#efb45f">Tasks</text><text x="112" y="396" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#f5f1e9">split the work</text><text x="440" y="396" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#efb45f">Attempts</text><text x="566" y="396" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#f5f1e9">try several whole answers</text><text x="860" y="396" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#efb45f">Placement</text><text x="1002" y="396" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#f5f1e9">choose where it runs</text><text x="20" y="450" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#bec9c6">A model can propose all three. It does not repeal the dependency graph, and it does not repeal the budget.</text></svg>
