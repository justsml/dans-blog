<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 500" role="img" aria-labelledby="title desc">
<title id="title">Seven fit; three do not</title><desc id="desc">A $1.50 provider cap admits seven $0.20 allowances. After six completions: $0.60 settled, $0.20 reserved, $0.70 available. Reconciliation leaves $0.70 settled and $0.80 available.</desc>
<g font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#f5f1e9">
<text x="20" y="35">$1.50 provider cap · 7 × $0.20 = $1.40 reserved · 3 refused</text>
<text x="20" y="115">Seven admitted</text><rect x="370" y="70" width="784" height="68" fill="#a4d2c4"/><rect x="1154" y="70" width="56" height="68" fill="#53616f"/><text x="710" y="115" fill="#122323">$1.40</text><text x="1144" y="160">$0.10</text>
<text x="20" y="245">Six confirmed</text><rect x="370" y="200" width="336" height="68" fill="#efb45f"/><rect x="706" y="200" width="112" height="68" fill="#a4d2c4"/><rect x="818" y="200" width="392" height="68" fill="#53616f"/><text x="500" y="245" fill="#122323">$0.60</text><text x="723" y="245" fill="#122323">$0.20</text><text x="970" y="245">$0.70</text>
<text x="20" y="375">Last reconciled</text><rect x="370" y="330" width="392" height="68" fill="#efb45f"/><rect x="762" y="330" width="448" height="68" fill="#53616f"/><text x="530" y="375" fill="#122323">$0.70</text><text x="950" y="375">$0.80</text>
<text x="370" y="465" fill="#efb45f">Settled</text><text x="650" y="465" fill="#a4d2c4">Reserved</text><text x="950" y="465">Available</text>
</g></svg>
