<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">An observation, not a diagnosis</title><desc id="desc">Separate a reasoning rubric from assistance. Record changing percentage base, learner used original amount, conceptual hint, and a fresh item after practice.</desc><rect width="1200" height="675" fill="#141d29"/><g font-family="Arial, sans-serif" fill="#f1f5f9"><text x="60" y="82" font-size="38" font-weight="700">An observation, not a diagnosis</text><text x="60" y="160" font-size="29" fill="#f1f5f9">Reasoning: base 0–2 · calculation 0–2 · transfer 0–2</text><text x="60" y="215" font-size="27" fill="#fbbf24">Help: separate column; asking a question costs nothing.</text><text x="60" y="310" font-size="27" fill="#fbbf24">Concept</text><text x="290" y="310" font-size="27" fill="#f1f5f9">Changing percentage base</text><text x="60" y="380" font-size="27" fill="#fbbf24">Observed</text><text x="290" y="380" font-size="27" fill="#f1f5f9">Used original amount for the second change</text><text x="60" y="450" font-size="27" fill="#fbbf24">Support</text><text x="290" y="450" font-size="27" fill="#f1f5f9">Conceptual hint</text><text x="60" y="520" font-size="27" fill="#fbbf24">Next check</text><text x="290" y="520" font-size="27" fill="#f1f5f9">Fresh item after practice</text></g></svg>