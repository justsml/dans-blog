<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Give the next rung. Record it.</title><desc id="desc">Six help rungs ascend from clarification through conceptual hint, missing step, parallel example, explanation, and fresh reconstruction; supported and independent performance are recorded separately.</desc><rect width="1200" height="675" fill="#141d29"/><g font-family="Arial, sans-serif" fill="#f1f5f9"><text x="60" y="82" font-size="38" font-weight="700">Give the next rung. Record it.</text><rect x="60" y="145" width="1080" height="62" rx="8" fill="#334155"/><text x="80" y="187" font-size="26" fill="#f1f5f9">1. Clarify the term</text><rect x="60" y="217" width="1080" height="62" rx="8" fill="#334155"/><text x="80" y="259" font-size="26" fill="#f1f5f9">2. Hint at the concept</text><rect x="60" y="289" width="1080" height="62" rx="8" fill="#334155"/><text x="80" y="331" font-size="26" fill="#f1f5f9">3. Identify the missing step</text><rect x="60" y="361" width="1080" height="62" rx="8" fill="#334155"/><text x="80" y="403" font-size="26" fill="#f1f5f9">4. Offer a parallel example</text><rect x="60" y="433" width="1080" height="62" rx="8" fill="#334155"/><text x="80" y="475" font-size="26" fill="#f1f5f9">5. Explain this example</text><rect x="60" y="505" width="1080" height="62" rx="8" fill="#7c5916"/><text x="80" y="547" font-size="26" fill="#f1f5f9">6. Fresh reconstruction: can they do the move?</text></g></svg>