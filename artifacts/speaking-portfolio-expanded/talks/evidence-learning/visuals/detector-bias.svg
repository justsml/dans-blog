<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">61% becomes 12% after a rewrite</title><desc id="desc">Historical false-positive averages, rounded, across seven detectors on 91 human-written TOEFL essays; not current product accuracy.</desc><rect width="1200" height="675" fill="#141d29"/><g font-family="Arial, sans-serif" fill="#f1f5f9"><text x="60" y="82" font-size="38" font-weight="700">61% becomes 12% after a rewrite</text><text x="60" y="145" font-size="25" fill="#f1f5f9">Liang et al. (2023) · 7 detectors · 91 human-written TOEFL essays</text><text x="60" y="230" font-size="25" fill="#f1f5f9">Original essays</text><rect x="60" y="255" width="610" height="65" rx="8" fill="#fbbf24"/><text x="695" y="300" font-size="40" fill="#f1f5f9">61%</text><text x="60" y="390" font-size="25" fill="#f1f5f9">Vocabulary-enhancing rewrite</text><rect x="60" y="415" width="120" height="65" rx="8" fill="#fbbf24"/><text x="205" y="460" font-size="40" fill="#f1f5f9">12%</text><text x="60" y="570" font-size="26" fill="#f1f5f9">Historical tools and essays. Not today’s product accuracy.</text><text x="60" y="620" font-size="21" fill="#f1f5f9">Source: doi:10.1016/j.patter.2023.100779</text></g></svg>