<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1280 480" width="1280" height="480"><title id="title">Controlled comparison loop</title><desc id="desc">Fix documents and questions, judge relevance, compare systems, inspect results, and change one thing. Contemporary eval artifacts follow the same loop.</desc><rect width="1280" height="480" fill="#16262c"/>
      <defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L10 5L0 10z" fill="#f1ebdd"/></marker></defs>
      <g stroke="#f1ebdd" stroke-width="2.5" fill="none" marker-end="url(#arr)">
        <path d="M330 120 H 520"/><path d="M760 120 H 950"/><path d="M1080 170 V 300"/><path d="M950 350 H 760"/><path d="M520 350 H 330"/><path d="M205 300 V 170"/>
      </g>
      <g font-size="26" fill="#f1ebdd" text-anchor="middle">
        <rect x="80" y="70" width="250" height="100" rx="10" fill="#16262c" stroke="#f1ebdd"/><text x="205" y="112">documents</text>
        <rect x="520" y="70" width="240" height="100" rx="10" fill="#16262c" stroke="#f1ebdd"/><text x="640" y="112">questions</text>
        <rect x="950" y="70" width="260" height="100" rx="10" fill="#16262c" stroke="#f1ebdd"/><text x="1080" y="112">relevance judgments</text>
        <rect x="950" y="300" width="260" height="100" rx="10" fill="#ffd23f" stroke="#ffd23f"/><text x="1080" y="342" fill="#3a2e00">compare systems</text>
        <rect x="520" y="300" width="240" height="100" rx="10" fill="#16262c" stroke="#f1ebdd"/><text x="640" y="342">a result</text>
        <rect x="80" y="300" width="250" height="100" rx="10" fill="#16262c" stroke="#f1ebdd"/><text x="205" y="342">change one thing</text>
      </g>
      <!-- 1966 labels above, 2026 labels below -->
      <g font-size="19" fill="#b9b3a4" text-anchor="middle">
        <text x="205" y="50">1966: a fixed document collection</text>
        <text x="640" y="50">1966: defined questions</text>
        <text x="1080" y="50">1966: human relevance judgments</text>
        <text x="1080" y="432">1966: indexing comparisons</text>
        <text x="640" y="432">1966: recall and precision</text>
        <text x="205" y="432">1966: the indexing language</text>
      </g>
      <g  font-size="18" fill="#ffd23f" text-anchor="middle">
        <text x="205" y="148">2026: your chunk store</text>
        <text x="640" y="148">2026: your test prompts</text>
        <text x="1080" y="148">2026: “expected chunks”</text>
        <text x="1080" y="378" fill="#3a2e00">2026: retriever A vs retriever B</text>
        <text x="640" y="378">2026: the eval number</text>
        <text x="205" y="378">2026: the embedding model</text>
      </g>
    </svg>