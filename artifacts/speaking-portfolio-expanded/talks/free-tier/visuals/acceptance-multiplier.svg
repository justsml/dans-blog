<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc"><title id="title">Same cost per accepted outcome</title><desc id="desc">45% accepted at baseline = 75% accepted after inference doubles</desc><rect width="1200" height="600" fill="#111827"/><g fill="#f9fafb" font-family="Arial,sans-serif"><text x="60" y="90" font-size="40">Same cost per accepted outcome</text><rect x="60" y="220" width="310" height="140" rx="12" fill="#253248" stroke="#fbbf24" stroke-width="3"/><text x="215" y="300" text-anchor="middle" font-size="29">$30 / 450</text><text x="397" y="300" fill="#fbbf24" font-size="36">=</text><rect x="445" y="220" width="310" height="140" rx="12" fill="#253248" stroke="#fbbf24" stroke-width="3"/><text x="600" y="300" text-anchor="middle" font-size="29">$0.0667</text><text x="782" y="300" fill="#fbbf24" font-size="36">=</text><rect x="830" y="220" width="310" height="140" rx="12" fill="#253248" stroke="#fbbf24" stroke-width="3"/><text x="985" y="300" text-anchor="middle" font-size="29">$50 / 750</text><text x="60" y="475" font-size="26">45% accepted at baseline = 75% accepted after inference doubles</text></g></svg>