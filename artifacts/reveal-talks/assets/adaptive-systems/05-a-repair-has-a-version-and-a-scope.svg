<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 500" role="img" aria-labelledby="title desc"><title id="title">A repair has a version and a scope</title><desc id="desc">Promote a tested mapping within its allowed scope; reconcile writes if you roll back.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#a4d2c4"/></marker></defs><rect x="20" y="110" width="300" height="160" rx="3" fill="none" stroke="#728482" stroke-width="1.5"/><text x="40" y="154" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#f5f1e9" text-anchor="start">Mapping v7</text><text x="40" y="198" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#bec9c6" text-anchor="start">Parent version</text><text x="40" y="236" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#bec9c6" text-anchor="start">Replay reference</text><path d="M340,190 L440,190" fill="none" stroke="#a4d2c4" stroke-width="3" marker-end="url(#arrow)"/><rect x="460" y="110" width="350" height="160" rx="3" fill="none" stroke="#a4d2c4" stroke-width="3"/><text x="480" y="154" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#a4d2c4" text-anchor="start">Candidate v8</text><text x="480" y="198" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#bec9c6" text-anchor="start">Evidence + fixtures</text><text x="480" y="236" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#bec9c6" text-anchor="start">Input fingerprint</text><path d="M830,190 L900,190" fill="none" stroke="#a4d2c4" stroke-width="3" marker-end="url(#arrow)"/><rect x="920" y="110" width="340" height="160" rx="3" fill="none" stroke="#728482" stroke-width="1.5"/><text x="940" y="154" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#f5f1e9" text-anchor="start">Bounded canary</text><text x="940" y="198" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#bec9c6" text-anchor="start">Matching contract</text><text x="940" y="236" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#bec9c6" text-anchor="start">Limited records</text><text x="20" y="365" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#f5f1e9" text-anchor="start">Rollback restores the adapter.</text><text x="630" y="365" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#a4d2c4" text-anchor="start">Downstream writes need reconciliation.</text><text x="20" y="470" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#bec9c6" text-anchor="start">Promote a tested mapping within its allowed scope; reconcile writes if you roll back.</text></svg>
