<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 500" role="img" aria-labelledby="title desc"><title id="title">The assistant with everything</title><desc id="desc">One agent holding every customer record and every dangerous tool is a breach waiting for a typo.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#728482"/></marker></defs><text x="20" y="44" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#bec9c6" letter-spacing="3">EVERYTHING IT CAN READ</text><rect x="20" y="60" width="330" height="80" rx="3" fill="none" stroke="#728482" stroke-width="1.5"/><text x="40" y="94" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#f5f1e9">Customer data</text><text x="40" y="124" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#bec9c6">PII, payments, history</text><rect x="20" y="160" width="330" height="80" rx="3" fill="none" stroke="#728482" stroke-width="1.5"/><text x="40" y="194" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#f5f1e9">Vendor payloads</text><text x="40" y="224" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#bec9c6">Untrusted input, read by an actor</text><rect x="20" y="260" width="330" height="80" rx="3" fill="none" stroke="#728482" stroke-width="1.5"/><text x="40" y="294" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#f5f1e9">Internal systems</text><text x="40" y="324" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#bec9c6">Databases, queues, deploys</text><path d="M350,100 L440,170" fill="none" stroke="#728482" stroke-width="2" marker-end="url(#arrow)"/><path d="M350,200 L440,200" fill="none" stroke="#728482" stroke-width="2" marker-end="url(#arrow)"/><path d="M350,300 L440,230" fill="none" stroke="#728482" stroke-width="2" marker-end="url(#arrow)"/><rect x="460" y="90" width="360" height="220" rx="3" fill="none" stroke="#a4d2c4" stroke-width="4"/><text x="640" y="150" font-family="Arial, Helvetica, sans-serif" font-size="38" fill="#a4d2c4" text-anchor="middle">One assistant</text><text x="640" y="200" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#f5f1e9" text-anchor="middle">Every record</text><text x="640" y="234" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#f5f1e9" text-anchor="middle">Every tool, all the time</text><text x="640" y="268" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#f5f1e9" text-anchor="middle">One prompt away from anything</text><text x="930" y="44" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#bec9c6" letter-spacing="3">EVERYTHING IT CAN DO</text><rect x="930" y="60" width="330" height="80" rx="3" fill="none" stroke="#728482" stroke-width="1.5"/><text x="950" y="94" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#f5f1e9">send · pay · delete</text><text x="950" y="124" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#bec9c6">Irreversible on purpose</text><rect x="930" y="160" width="330" height="80" rx="3" fill="none" stroke="#728482" stroke-width="1.5"/><text x="950" y="194" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#f5f1e9">deploy · export</text><text x="950" y="224" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#bec9c6">Blast radius: everyone</text><rect x="930" y="260" width="330" height="80" rx="3" fill="none" stroke="#728482" stroke-width="1.5"/><text x="950" y="294" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#f5f1e9">Whatever it was told to</text><text x="950" y="324" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#bec9c6">By you, or by a payload</text><path d="M820,170 L910,100" fill="none" stroke="#728482" stroke-width="2" marker-end="url(#arrow)"/><path d="M820,200 L910,200" fill="none" stroke="#728482" stroke-width="2" marker-end="url(#arrow)"/><path d="M820,230 L910,300" fill="none" stroke="#728482" stroke-width="2" marker-end="url(#arrow)"/><line x1="20" y1="372" x2="1260" y2="372" stroke="#728482" stroke-width="1"/><text x="20" y="418" font-family="Arial, Helvetica, sans-serif" font-size="27" fill="#f5f1e9">Most of the damage will be accidents. Some will be people who mean it.</text><text x="20" y="460" font-family="Arial, Helvetica, sans-serif" font-size="27" fill="#a4d2c4">Do not build this one. Conjure a small one per job.</text></svg>
