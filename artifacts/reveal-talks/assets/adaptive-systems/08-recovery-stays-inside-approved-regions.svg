<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 500" role="img" aria-labelledby="title desc"><title id="title">Recovery stays inside approved regions</title><desc id="desc">Check the entire dependency path; lower latency alone does not authorize a destination.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#a4d2c4"/></marker></defs><rect x="20" y="140" width="310" height="150" rx="3" fill="none" stroke="#728482" stroke-width="1.5"/><text x="40" y="184" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#f5f1e9" text-anchor="start">Region A</text><text x="40" y="228" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#bec9c6" text-anchor="start">Dependency unavailable</text><path d="M350,215 L430,215" fill="none" stroke="#a4d2c4" stroke-width="3" marker-end="url(#arrow)"/><rect x="450" y="85" width="360" height="145" rx="3" fill="none" stroke="#a4d2c4" stroke-width="3"/><text x="470" y="129" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#a4d2c4" text-anchor="start">Region B</text><text x="470" y="173" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#bec9c6" text-anchor="start">Approved + probe passes</text><rect x="450" y="260" width="360" height="145" rx="3" fill="none" stroke="#728482" stroke-width="1.5"/><text x="470" y="304" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#f5f1e9" text-anchor="start">Region C</text><text x="470" y="348" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#bec9c6" text-anchor="start">Not approved</text><text x="880" y="130" font-family="Arial, Helvetica, sans-serif" font-size="32" fill="#a4d2c4" text-anchor="start">Before dispatch</text><text x="880" y="185" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#f5f1e9" text-anchor="start">Residency</text><text x="880" y="223" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#f5f1e9" text-anchor="start">Capacity</text><text x="880" y="261" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#f5f1e9" text-anchor="start">Credentials</text><text x="880" y="299" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#f5f1e9" text-anchor="start">Deadline</text><text x="20" y="470" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#bec9c6" text-anchor="start">Check the entire dependency path; lower latency alone does not authorize a destination.</text></svg>
