<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 500" role="img" aria-labelledby="title desc"><title id="title">Proposal and authority are separate</title><desc id="desc">The planner proposes a mapping; trusted code validates and controls its activation.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#a4d2c4"/></marker></defs><rect x="20" y="110" width="350" height="160" rx="3" fill="none" stroke="#a4d2c4" stroke-width="3"/><text x="40" y="154" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#a4d2c4" text-anchor="start">Planner</text><text x="40" y="198" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#bec9c6" text-anchor="start">Approved evidence</text><text x="40" y="236" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#bec9c6" text-anchor="start">Mapping proposal</text><path d="M390,190 L440,190" fill="none" stroke="#a4d2c4" stroke-width="3" marker-end="url(#arrow)"/><rect x="460" y="110" width="350" height="160" rx="3" fill="none" stroke="#728482" stroke-width="1.5"/><text x="480" y="154" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#f5f1e9" text-anchor="start">Validator</text><text x="480" y="198" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#bec9c6" text-anchor="start">Tests + policy</text><text x="480" y="236" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#bec9c6" text-anchor="start">Budget + scope</text><path d="M830,190 L880,190" fill="none" stroke="#a4d2c4" stroke-width="3" marker-end="url(#arrow)"/><rect x="900" y="110" width="360" height="160" rx="3" fill="none" stroke="#728482" stroke-width="1.5"/><text x="920" y="154" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#f5f1e9" text-anchor="start">Executor</text><text x="920" y="198" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#bec9c6" text-anchor="start">Versioned canary</text><text x="920" y="236" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#bec9c6" text-anchor="start">Record outcome</text><text x="460" y="345" font-family="Arial, Helvetica, sans-serif" font-size="29" fill="#a4d2c4" text-anchor="start">Deployment credentials stay here</text><path d="M850,333 L1050,290" fill="none" stroke="#a4d2c4" stroke-width="3" marker-end="url(#arrow)"/><text x="20" y="470" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#bec9c6" text-anchor="start">The planner proposes a mapping; trusted code validates and controls its activation.</text></svg>
