<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 500" role="img" aria-labelledby="title desc"><title id="title">A rename is not a new meaning</title><desc id="desc">A documented rename can preserve meaning; an undefined business state needs an owner.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#a4d2c4"/></marker></defs><text x="20" y="50" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#a4d2c4" text-anchor="start">STRUCTURAL CHANGE</text><rect x="20" y="80" width="350" height="120" rx="3" fill="none" stroke="#728482" stroke-width="1.5"/><text x="40" y="124" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#f5f1e9" text-anchor="start">zip</text><text x="40" y="168" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#bec9c6" text-anchor="start">&quot;02108&quot;</text><path d="M390,140 L465,140" fill="none" stroke="#a4d2c4" stroke-width="3" marker-end="url(#arrow)"/><rect x="485" y="80" width="350" height="120" rx="3" fill="none" stroke="#a4d2c4" stroke-width="3"/><text x="505" y="124" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#a4d2c4" text-anchor="start">postal_code</text><text x="505" y="168" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#bec9c6" text-anchor="start">&quot;02108&quot;</text><text x="900" y="120" font-family="Arial, Helvetica, sans-serif" font-size="27" fill="#f5f1e9" text-anchor="start">Contract evidence</text><text x="900" y="158" font-family="Arial, Helvetica, sans-serif" font-size="27" fill="#f5f1e9" text-anchor="start">+ negative tests</text><path d="M20,250 H1260" stroke="#728482" stroke-width="1"/><text x="20" y="300" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#a4d2c4" text-anchor="start">SEMANTIC CHANGE</text><text x="20" y="365" font-family="Arial, Helvetica, sans-serif" font-size="34" fill="#f5f1e9" text-anchor="start">status: true</text><path d="M315,355 L440,355" fill="none" stroke="#a4d2c4" stroke-width="3" marker-end="url(#arrow)"/><text x="485" y="365" font-family="Arial, Helvetica, sans-serif" font-size="34" fill="#f5f1e9" text-anchor="start">status: &quot;pending&quot;</text><text x="940" y="345" font-family="Arial, Helvetica, sans-serif" font-size="27" fill="#a4d2c4" text-anchor="start">Unknown meaning</text><text x="940" y="383" font-family="Arial, Helvetica, sans-serif" font-size="27" fill="#a4d2c4" text-anchor="start">Quarantine</text><text x="20" y="470" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#bec9c6" text-anchor="start">A documented rename can preserve meaning; an undefined business state needs an owner.</text></svg>
