<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 500" role="img" aria-labelledby="title desc"><title id="title">Keep access capabilities out of the planner</title><desc id="desc">Proposed boundary: the dispatcher grants worker access; only allowlisted status returns to the planner.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#a4d2c4"/></marker></defs><rect x="20" y="80" width="340" height="140" rx="3" fill="none" stroke="#a4d2c4" stroke-width="3"/><text x="40" y="124" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#a4d2c4" text-anchor="start">Frontier planner</text><text x="40" y="168" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#bec9c6" text-anchor="start">Opaque job reference</text><path d="M380,150 L435,150" fill="none" stroke="#a4d2c4" stroke-width="3" marker-end="url(#arrow)"/><rect x="455" y="80" width="350" height="140" rx="3" fill="none" stroke="#728482" stroke-width="1.5"/><text x="475" y="124" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#f5f1e9" text-anchor="start">Trusted dispatcher</text><text x="475" y="168" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#bec9c6" text-anchor="start">Authorize job</text><text x="475" y="206" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#bec9c6" text-anchor="start">Grant scoped access</text><path d="M825,150 L880,150" fill="none" stroke="#a4d2c4" stroke-width="3" marker-end="url(#arrow)"/><rect x="900" y="80" width="360" height="140" rx="3" fill="none" stroke="#728482" stroke-width="1.5"/><text x="920" y="124" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#f5f1e9" text-anchor="start">Local worker</text><text x="920" y="168" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#bec9c6" text-anchor="start">Process sensitive data</text><rect x="900" y="290" width="360" height="110" rx="3" fill="none" stroke="#728482" stroke-width="1.5"/><text x="920" y="334" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#f5f1e9" text-anchor="start">Approved storage</text><path d="M1080,240 L1080,270" fill="none" stroke="#a4d2c4" stroke-width="3" marker-end="url(#arrow)"/><text x="20" y="470" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#bec9c6" text-anchor="start">Proposed boundary: the dispatcher grants worker access; only allowlisted status returns to the planner.</text><rect x="455" y="290" width="350" height="110" rx="3" fill="none" stroke="#728482" stroke-width="1.5"/>
<text x="475" y="334" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#a4d2c4">Status filter</text>
<text x="475" y="378" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#bec9c6">Allowlisted fields only</text>
<path d="M1040,235 V250 H630 V275" fill="none" stroke="#a4d2c4" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M435,345 H190 V235" fill="none" stroke="#a4d2c4" stroke-width="3" marker-end="url(#arrow)"/>
<text x="20" y="425" font-family="Arial, Helvetica, sans-serif" font-size="27" fill="#f5f1e9">No signed URL in planner context</text>
</svg>
