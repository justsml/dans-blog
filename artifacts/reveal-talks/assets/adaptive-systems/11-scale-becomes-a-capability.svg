<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 500" role="img" aria-labelledby="title desc"><title id="title">Scale becomes a capability</title><desc id="desc">The orchestrator requests shape, size and duration inside a per-customer ceiling; the scheduler resolves it against a catalog and issues a lease.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#a4d2c4"/></marker></defs><text x="20" y="44" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#bec9c6" letter-spacing="3">BEFORE</text><text x="20" y="80" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#bec9c6">Ops sizes the fleet once, for everyone. Replicas, instance class, a CPU threshold. Warm and idle.</text><text x="20" y="134" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#a4d2c4" letter-spacing="3">NOW</text><text x="20" y="170" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#f5f1e9">The job describes its own shape and asks. The scheduler grants a lease inside this customer's ceiling.</text><rect x="20" y="210" width="360" height="180" rx="3" fill="none" stroke="#a4d2c4" stroke-width="3"/><text x="42" y="252" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#a4d2c4">Job request</text><text x="42" y="296" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#f5f1e9">shape: waiting on a provider</text><text x="42" y="330" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#f5f1e9">size: 8 sandboxes · 6 min</text><text x="42" y="364" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#f5f1e9">cap: $1.50 · customer 4471</text><path d="M380,300 L448,300" fill="none" stroke="#a4d2c4" stroke-width="3" marker-end="url(#arrow)"/><rect x="468" y="210" width="360" height="180" rx="3" fill="none" stroke="#728482" stroke-width="1.5"/><text x="490" y="252" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#f5f1e9">Scheduler</text><text x="490" y="296" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#bec9c6">Catalog of approved classes</text><text x="490" y="330" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#bec9c6">Plan, budget, residency</text><text x="490" y="364" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#bec9c6">Enforced outside the model</text><path d="M828,300 L896,300" fill="none" stroke="#a4d2c4" stroke-width="3" marker-end="url(#arrow)"/><rect x="916" y="210" width="344" height="180" rx="3" fill="none" stroke="#a4d2c4" stroke-width="3"/><text x="938" y="252" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#a4d2c4">Lease</text><text x="938" y="296" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#f5f1e9">8 × sandbox-small</text><text x="938" y="330" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#f5f1e9">expires 06:00 · teardown</text><text x="938" y="364" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#f5f1e9">billed to customer 4471</text><text x="20" y="450" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#a4d2c4">Per-customer, per-job cost controls. Pay for performance. Cap a workflow, not an environment.</text></svg>
