<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 500" role="img" aria-labelledby="title desc"><title id="title">Synthesis must pass the gates again</title><desc id="desc">Useful parts can conflict. A combined design is a new candidate, not an inherited pass.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#efb45f"/></marker></defs><rect x="20" y="40" width="350" height="105" rx="3" fill="none" stroke="#728482" stroke-width="1.5"/><text x="40" y="84" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#f5f1e9" text-anchor="start">Candidate A</text><text x="40" y="128" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#bec9c6" text-anchor="start">Small interface</text><rect x="20" y="240" width="350" height="105" rx="3" fill="none" stroke="#728482" stroke-width="1.5"/><text x="40" y="284" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#f5f1e9" text-anchor="start">Candidate B</text><text x="40" y="328" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#bec9c6" text-anchor="start">Shared coordination</text><path d="M390,92 L455,92" fill="none" stroke="#efb45f" stroke-width="3" marker-end="url(#arrow)"/><path d="M390,292 L455,292" fill="none" stroke="#efb45f" stroke-width="3" marker-end="url(#arrow)"/><rect x="475" y="40" width="350" height="305" rx="3" fill="none" stroke="#efb45f" stroke-width="3"/><text x="495" y="84" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#efb45f" text-anchor="start">New candidate</text><text x="495" y="128" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#bec9c6" text-anchor="start">Resolve assumptions</text><text x="495" y="166" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#bec9c6" text-anchor="start">Integrate compatible ideas</text><path d="M845,192 L910,192" fill="none" stroke="#efb45f" stroke-width="3" marker-end="url(#arrow)"/><rect x="930" y="110" width="330" height="170" rx="3" fill="none" stroke="#728482" stroke-width="1.5"/><text x="950" y="154" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#f5f1e9" text-anchor="start">Revalidate</text><text x="950" y="198" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#bec9c6" text-anchor="start">Executable checks</text><text x="950" y="236" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#bec9c6" text-anchor="start">Review missing cases</text><text x="20" y="470" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#bec9c6" text-anchor="start">Useful parts can conflict. A combined design is a new candidate, not an inherited pass.</text></svg>
