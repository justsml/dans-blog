<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 500" role="img" aria-labelledby="title desc"><title id="title">A job survives the caller</title><desc id="desc">Persist intent and provider identity; uncertain acceptance goes to reconciliation, not blind replay.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#efb45f"/></marker></defs><rect x="20" y="50" width="300" height="115" rx="3" fill="none" stroke="#728482" stroke-width="1.5"/><text x="40" y="94" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#f5f1e9" text-anchor="start">Queued</text><text x="40" y="138" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#bec9c6" text-anchor="start">Accepted items</text><path d="M340,108 L425,108" fill="none" stroke="#efb45f" stroke-width="3" marker-end="url(#arrow)"/><rect x="445" y="50" width="360" height="115" rx="3" fill="none" stroke="#efb45f" stroke-width="3"/><text x="465" y="94" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#efb45f" text-anchor="start">Submitted</text><text x="465" y="138" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#bec9c6" text-anchor="start">Persist dispatch intent</text><path d="M825,108 L900,108" fill="none" stroke="#efb45f" stroke-width="3" marker-end="url(#arrow)"/><rect x="920" y="50" width="340" height="115" rx="3" fill="none" stroke="#728482" stroke-width="1.5"/><text x="940" y="94" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#f5f1e9" text-anchor="start">Waiting</text><text x="940" y="138" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#bec9c6" text-anchor="start">Provider ID saved</text><path d="M625,185 L625,270" fill="none" stroke="#efb45f" stroke-width="3" marker-end="url(#arrow)" stroke-dasharray="9 7"/><rect x="445" y="290" width="360" height="115" rx="3" fill="none" stroke="#728482" stroke-width="1.5"/><text x="465" y="334" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#f5f1e9" text-anchor="start">Unresolved</text><text x="465" y="378" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#bec9c6" text-anchor="start">Acceptance unknown</text><text x="20" y="340" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#f5f1e9" text-anchor="start">Reconstruct from</text><text x="20" y="378" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#f5f1e9" text-anchor="start">persisted state</text><text x="20" y="470" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#bec9c6" text-anchor="start">Persist intent and provider identity; uncertain acceptance goes to reconciliation, not blind replay.</text><text x="920" y="250" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#f5f1e9">Output confirmed</text><text x="920" y="288" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#f5f1e9">→ completed</text><text x="920" y="326" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#f5f1e9">Failure confirmed</text><text x="920" y="364" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#f5f1e9">→ failed</text></svg>
