<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 500" role="img" aria-labelledby="title desc"><title id="title">Independent attempts share requirements</title><desc id="desc">Different priorities expose tradeoffs. Common requirements and checks apply to every candidate.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#efb45f"/></marker></defs><text x="20" y="45" font-family="Arial, Helvetica, sans-serif" font-size="27" fill="#efb45f" text-anchor="start">ONE TASK + ONE RUBRIC + ONE SHARED BUDGET</text><rect x="20" y="125" width="360" height="180" rx="3" fill="none" stroke="#efb45f" stroke-width="3"/><text x="40" y="169" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#efb45f" text-anchor="start">Minimalist</text><text x="40" y="213" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#bec9c6" text-anchor="start">Smallest adequate scope</text><text x="40" y="355" font-family="Arial, Helvetica, sans-serif" font-size="27" fill="#f5f1e9" text-anchor="start">Independent artifact</text><rect x="460" y="125" width="360" height="180" rx="3" fill="none" stroke="#efb45f" stroke-width="3"/><text x="480" y="169" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#efb45f" text-anchor="start">Maintainer</text><text x="480" y="213" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#bec9c6" text-anchor="start">Recoverable state</text><text x="480" y="355" font-family="Arial, Helvetica, sans-serif" font-size="27" fill="#f5f1e9" text-anchor="start">Independent artifact</text><rect x="900" y="125" width="360" height="180" rx="3" fill="none" stroke="#efb45f" stroke-width="3"/><text x="920" y="169" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#efb45f" text-anchor="start">Security / perf</text><text x="920" y="213" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#bec9c6" text-anchor="start">Limits and failure 