<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="500" viewBox="0 0 1280 500" role="img">
<title>Each integration must answer the next question</title>
<rect width="1280" height="500" fill="#161d26"/>
<text x="45" y="60" fill="#efb45f" font-family="Arial,sans-serif" font-size="30">Each integration must answer the next question</text>
<path d="M45 158 H1230" stroke="#53606d"/>
<text x="45" y="135" fill="#efb45f" font-family="Arial,sans-serif" font-size="29">Logs</text>
<text x="400" y="135" fill="#f5f1e9" font-family="Arial,sans-serif" font-size="27">What failed, how often, and when?</text>
<path d="M45 233 H1230" stroke="#53606d"/>
<text x="45" y="210" fill="#efb45f" font-family="Arial,sans-serif" font-size="29">Code</text>
<text x="400" y="210" fill="#f5f1e9" font-family="Arial,sans-serif" font-size="27">Which branch produced it?</text>
<path d="M45 308 H1230" stroke="#53606d"/>
<text x="45" y="285" fill="#efb45f" font-family="Arial,sans-serif" font-size="29">Trace</text>
<text x="400" y="285" fill="#f5f1e9" font-family="Arial,sans-serif" font-size="27">What happened before it?</text>
<path d="M45 383 H1230" stroke="#53606d"/>
<text x="45" y="360" fill="#efb45f" font-family="Arial,sans-serif" font-size="29">Reproduction</text>
<text x="400" y="360" fill="#f5f1e9" font-family="Arial,sans-serif" font-size="27">Does the explanation survive a test?</text>
<path d="M45 458 H1230" stroke="#53606d"/>
<text x="45" y="435" fill="#efb45f" font-family="Arial,sans-serif" font-size="29">Ticket</text>
<text x="400" y="435" fill="#f5f1e9" font-family="Arial,sans-serif" font-size="27">Who can act on this evidence?</text>
</svg>
