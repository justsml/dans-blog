<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="500" viewBox="0 0 1280 500" role="img">
<title>The evaluation method is sixty years old</title>
<rect width="1280" height="500" fill="#161d26"/>
<text x="45" y="60" fill="#efb45f" font-family="Arial,sans-serif" font-size="30">The evaluation method is sixty years old</text>
<path d="M45 158 H1230" stroke="#53606d"/>
<text x="45" y="135" fill="#efb45f" font-family="Arial,sans-serif" font-size="29">1966 · Cranfield</text>
<text x="400" y="135" fill="#f5f1e9" font-family="Arial,sans-serif" font-size="27">Fixed corpus, questions, human judgments</text>
<path d="M45 233 H1230" stroke="#53606d"/>
<text x="45" y="210" fill="#efb45f" font-family="Arial,sans-serif" font-size="29">1992 · TREC</text>
<text x="400" y="210" fill="#f5f1e9" font-family="Arial,sans-serif" font-size="27">Shared retrieval evaluation at NIST</text>
<path d="M45 308 H1230" stroke="#53606d"/>
<text x="45" y="285" fill="#efb45f" font-family="Arial,sans-serif" font-size="29">1998 · Zobel</text>
<text x="400" y="285" fill="#f5f1e9" font-family="Arial,sans-serif" font-size="27">Investigate incomplete judgments</text>
<path d="M45 383 H1230" stroke="#53606d"/>
<text x="45" y="360" fill="#efb45f" font-family="Arial,sans-serif" font-size="29">2000 · Voorhees</text>
<text x="400" y="360" fill="#f5f1e9" font-family="Arial,sans-serif" font-size="27">Vary assessors; compare rankings</text>
<path d="M45 458 H1230" stroke="#53606d"/>
<text x="45" y="435" fill="#efb45f" font-family="Arial,sans-serif" font-size="29">2022 · Recheck</text>
<text x="400" y="435" fill="#f5f1e9" font-family="Arial,sans-serif" font-size="27">Expanded TREC-8 labels; rank τ &gt; 0.99</text>
</svg>
