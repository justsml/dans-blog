<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="500" viewBox="0 0 1280 500" role="img">
<title>Design the handoff, not a robot org chart</title>
<rect width="1280" height="500" fill="#161d26"/>
<text x="45" y="60" fill="#efb45f" font-family="Arial,sans-serif" font-size="30">Design the handoff, not a robot org chart</text>
<path d="M45 158 H1230" stroke="#53606d"/>
<text x="45" y="135" fill="#efb45f" font-family="Arial,sans-serif" font-size="29">Research</text>
<text x="400" y="135" fill="#f5f1e9" font-family="Arial,sans-serif" font-size="27">Dated source URLs → brief</text>
<path d="M45 233 H1230" stroke="#53606d"/>
<text x="45" y="210" fill="#efb45f" font-family="Arial,sans-serif" font-size="29">Feedback</text>
<text x="400" y="210" fill="#f5f1e9" font-family="Arial,sans-serif" font-size="27">Original complaints → clusters</text>
<path d="M45 308 H1230" stroke="#53606d"/>
<text x="45" y="285" fill="#efb45f" font-family="Arial,sans-serif" font-size="29">Product review</text>
<text x="400" y="285" fill="#f5f1e9" font-family="Arial,sans-serif" font-size="27">Disagreement → accepted hypothesis</text>
<path d="M45 383 H1230" stroke="#53606d"/>
<text x="45" y="360" fill="#efb45f" font-family="Arial,sans-serif" font-size="29">Build</text>
<text x="400" y="360" fill="#f5f1e9" font-family="Arial,sans-serif" font-size="27">Hypothesis → candidate + evidence</text>
<path d="M45 458 H1230" stroke="#53606d"/>
<text x="45" y="435" fill="#efb45f" font-family="Arial,sans-serif" font-size="29">Experiment owner</text>
<text x="400" y="435" fill="#f5f1e9" font-family="Arial,sans-serif" font-size="27">Evidence → bounded rollout decision</text>
</svg>
