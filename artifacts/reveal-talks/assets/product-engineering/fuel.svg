<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 500" role="img" aria-labelledby="title desc"><title id="title">A finished product still burns fuel</title><desc id="desc">Prediction: tokens stop being a build cost and become a running cost. A shipped product with no new features still burns tokens to stay current and to defend itself, and somebody owns that meter.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#efb45f"/></marker></defs><text x="20" y="34" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#efb45f" text-anchor="start">PREDICTION · TOKENS STOP BEING A BUILD COST AND BECOME A RUNNING COST</text><rect x="20" y="58" width="470" height="150" rx="3" fill="none" stroke="#bec9c6" stroke-width="3"/><text x="44" y="100" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#f5f1e9" text-anchor="start">Shipped. Finished.</text><text x="44" y="140" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#bec9c6" text-anchor="start">new features this quarter: 0</text><text x="44" y="180" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#bec9c6" text-anchor="start">roadmap: empty</text><path d="M496,133 L560,133" stroke="#efb45f" stroke-width="4" marker-end="url(#arrow)"/><text x="566" y="112" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#efb45f" text-anchor="start">FUEL LINE</text><text x="566" y="150" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#bec9c6" text-anchor="start">steady for some systems, bursty for others</text><rect x="20" y="240" width="390" height="130" rx="3" fill="none" stroke="#efb45f" stroke-width="3"/><text x="44" y="280" font-family="Arial, Helvetica, sans-serif" font-size="27" fill="#efb45f" text-anchor="start">Stay current</text><text x="44" y="316" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#bec9c6" text-anchor="start">re-derive the renamed integration</text><text x="44" y="348" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#bec9c6" text-anchor="start">keep its own docs true</text><rect x="445" y="240" width="390" height="130" rx="3" fill="none" stroke="#efb45f" stroke-width="3"/><text x="469" y="280" font-family="Arial, Helvetica, sans-serif" font-size="27" fill="#efb45f" text-anchor="start">Defend itself</text><text x="469" y="316" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#bec9c6" text-anchor="start">sentry bots, 24/7, forever</text><text x="469" y="348" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#bec9c6" text-anchor="start">symmetric answer to a tireless attacker</text><rect x="870" y="240" width="390" height="130" rx="3" fill="none" stroke="#f5f1e9" stroke-width="3"/><text x="894" y="280" font-family="Arial, Helvetica, sans-serif" font-size="27" fill="#f5f1e9" text-anchor="start">The meter</text><text x="894" y="316" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#bec9c6" text-anchor="start">beside the latency budget</text><text x="894" y="348" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#bec9c6" text-anchor="start">owner: not whoever wrote the prompt</text><text x="20" y="424" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#f5f1e9" text-anchor="start">It never completes. A permanent line item on a product that is otherwise done.</text><text x="20" y="466" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#efb45f" text-anchor="start">Careful firing the sentry bots. They know who you are, and they have read all of your commits.</text></svg>
