<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 500" role="img" aria-labelledby="title desc"><title id="title">The ephemeral ecosystem</title><desc id="desc">Sandboxes, serverless GPUs, durable edge state and spot capacity, all created in seconds and torn down by default.</desc><text x="20" y="46" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#bec9c6" letter-spacing="3">SANDBOXES</text><rect x="20" y="60" width="295" height="230" rx="3" fill="none" stroke="#efb45f" stroke-width="3"/><text x="40" y="104" font-family="Arial, Helvetica, sans-serif" font-size="27" fill="#f5f1e9">Fly.io Sprites</text><text x="40" y="136" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#bec9c6">Isolated VM in 1 to 2 seconds</text><text x="40" y="162" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#bec9c6">Egress policy set from outside</text><text x="40" y="216" font-family="Arial, Helvetica, sans-serif" font-size="27" fill="#f5f1e9">Depot</text><text x="40" y="248" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#bec9c6">Per-second sandboxes</text><text x="40" y="274" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#bec9c6">Built for agent-written code</text><text x="335" y="46" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#bec9c6" letter-spacing="3">SERVERLESS + GPU</text><rect x="335" y="60" width="295" height="230" rx="3" fill="none" stroke="#728482" stroke-width="1.5"/><text x="355" y="104" font-family="Arial, Helvetica, sans-serif" font-size="27" fill="#f5f1e9">Modal</text><text x="355" y="136" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#bec9c6">Functions and GPUs</text><text x="355" y="162" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#bec9c6">Scale to zero</text><text x="355" y="216" font-family="Arial, Helvetica, sans-serif" font-size="27" fill="#f5f1e9">Vast.ai</text><text x="355" y="248" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#bec9c6">GPU marketplace</text><text x="355" y="274" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#bec9c6">Cheap, short-lived</text><text x="650" y="46" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#bec9c6" letter-spacing="3">DURABLE EDGE STATE</text><rect x="650" y="60" width="295" height="230" rx="3" fill="none" stroke="#728482" stroke-width="1.5"/><text x="670" y="104" font-family="Arial, Helvetica, sans-serif" font-size="27" fill="#f5f1e9">Cloudflare Workers</text><text x="670" y="136" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#bec9c6">Durable Objects: coordination</text><text x="670" y="162" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#bec9c6">Workflows: steps and waits</text><text x="670" y="216" font-family="Arial, Helvetica, sans-serif" font-size="27" fill="#efb45f">The ledger lives here</text><text x="670" y="248" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#bec9c6">Outlives every box</text><text x="670" y="274" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#bec9c6">that gets torn down</text><text x="965" y="46" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#bec9c6" letter-spacing="3">INTERRUPTIBLE</text><rect x="965" y="60" width="295" height="230" rx="3" fill="none" stroke="#728482" stroke-width="1.5"/><text x="985" y="104" font-family="Arial, Helvetica, sans-serif" font-size="27" fill="#f5f1e9">AWS EC2 Spot</text><text x="985" y="136" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#bec9c6">Two-minute reclaim notice</text><text x="985" y="162" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#bec9c6">The job must restart</text><text x="985" y="216" font-family="Arial, Helvetica, sans-serif" font-size="27" fill="#f5f1e9">The original idea</text><text x="985" y="248" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#bec9c6">Cheap because it is</text><text x="985" y="274" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#bec9c6">never promised</text><line x1="20" y1="330" x2="1260" y2="330" stroke="#728482" stroke-width="1"/><text x="20" y="378" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#efb45f">Create in seconds. Pay per second. Torn down by default. Egress narrowed from outside.</text><text x="20" y="424" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#f5f1e9">None of them ship the ledger. That is still yours.</text><text x="20" y="466" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#728482">Vendor claims checked 2026-09-06 against public docs. Verify limits and prices before depending on them.</text></svg>
