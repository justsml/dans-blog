<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 500" role="img" aria-labelledby="title desc"><title id="title">Every caller crosses shared admission</title><desc id="desc">One coordinated reservation protects tenant spend and entitlement across all callers.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#efb45f"/></marker></defs><rect x="20" y="20" width="330" height="100" rx="3" fill="none" stroke="#728482" stroke-width="1.5"/><text x="40" y="64" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#f5f1e9" text-anchor="start">Conversation A</text><path d="M370,70 L470,70" fill="none" stroke="#efb45f" stroke-width="3" marker-end="url(#arrow)"/><rect x="20" y="160" width="330" height="100" rx="3" fill="none" stroke="#728482" stroke-width="1.5"/><text x="40" y="204" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#f5f1e9" text-anchor="start">Conversation B</text><path d="M370,210 L470,210" fill="none" stroke="#efb45f" stroke-width="3" marker-end="url(#arrow)"/><rect x="20" y="300" width="330" height="100" rx="3" fill="none" stroke="#728482" stroke-width="1.5"/><text x="40" y="344" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#f5f1e9" text-anchor="start">Scheduled job</text><path d="M370,350 L470,350" fill="none" stroke="#efb45f" stroke-width="3" marker-end="url(#arrow)"/><rect x="490" y="20" width="370" height="380" rx="3" fill="none" stroke="#efb45f" stroke-width="3"/><text x="510" y="64" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#efb45f" text-anchor="start">Shared admission</text><text x="510" y="108" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#bec9c6" text-anchor="start">Tenant entitlement</text><text x="510" y="146" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#bec9c6" text-anchor="start">Spend reservations</text><text x="510" y="184" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#bec9c6" text-anchor="start">Provider concurrency</text><text x="510" y="222" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#bec9c6" text-anchor="start">Request rate</text><text x="510" y="260" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#bec9c6" text-anchor="start">Run deadline</text><path d="M880,210 L940,210" fill="none" stroke="#efb45f" stroke-width="3" marker-end="url(#arrow)"/><rect x="960" y="150" width="300" height="125" rx="3" fill="none" stroke="#728482" stroke-width="1.5"/><text x="980" y="194" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#f5f1e9" text-anchor="start">Dispatch</text><text x="980" y="238" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#bec9c6" text-anchor="start">Or queue / reject</text><text x="20" y="470" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#bec9c6" text-anchor="start">One coordinated reservation protects tenant spend and entitlement across all callers.</text></svg>
