<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 500" role="img" aria-labelledby="title desc"><title id="title">Count items and attempts separately</title><desc id="desc">One retry per item can turn 40 logical items into 80 provider attempts.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#efb45f"/></marker></defs><rect x="20" y="100" width="350" height="180" rx="3" fill="none" stroke="#728482" stroke-width="1.5"/><text x="40" y="144" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#f5f1e9" text-anchor="start">4 tool slots</text><text x="40" y="188" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#bec9c6" text-anchor="start">Visible to the agent</text><path d="M390,190 L440,190" fill="none" stroke="#efb45f" stroke-width="3" marker-end="url(#arrow)"/><rect x="460" y="100" width="350" height="180" rx="3" fill="none" stroke="#efb45f" stroke-width="3"/><text x="480" y="144" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#efb45f" text-anchor="start">40 logical items</text><text x="480" y="188" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#bec9c6" text-anchor="start">4 batches × 10 images</text><path d="M830,190 L880,190" fill="none" stroke="#efb45f" stroke-width="3" marker-end="url(#arrow)"/><rect x="900" y="100" width="360" height="180" rx="3" fill="none" stroke="#728482" stroke-width="1.5"/><text x="920" y="144" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#f5f1e9" text-anchor="start">Up to 80 attempts</text><text x="920" y="188" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#bec9c6" text-anchor="start">If every item retries once</text><text x="20" y="365" font-family="Arial, Helvetica, sans-serif" font-size="29" fill="#f5f1e9" text-anchor="start">A retry consumes resources. It does not create a new customer entitlement.</text><text x="20" y="470" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#bec9c6" text-anchor="start">One retry per item can turn 40 logical items into 80 provider attempts.</text></svg>
