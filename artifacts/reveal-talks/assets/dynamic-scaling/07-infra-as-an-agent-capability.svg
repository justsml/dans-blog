<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 500" role="img" aria-labelledby="title desc"><title id="title">Infra as an agent capability</title><desc id="desc">The job requests shape, size, duration and a cost cap; the scheduler resolves it against a catalog and tenant budget and returns a lease.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#efb45f"/></marker></defs><rect x="20" y="70" width="360" height="230" rx="3" fill="none" stroke="#efb45f" stroke-width="3"/><text x="40" y="112" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#efb45f">Orchestrator asks</text><text x="40" y="156" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#bec9c6">shape: provider wait</text><text x="40" y="192" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#bec9c6">size: 8 sandboxes · 6 min</text><text x="40" y="228" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#bec9c6">region: us-east (approved)</text><text x="40" y="264" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#bec9c6">cap: $1.50 · tenant 4471</text><path d="M380,185 L455,185" fill="none" stroke="#efb45f" stroke-width="3" marker-end="url(#arrow)"/><rect x="475" y="70" width="360" height="230" rx="3" fill="none" stroke="#728482" stroke-width="1.5"/><text x="495" y="112" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#f5f1e9">Scheduler resolves</text><text x="495" y="156" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#bec9c6">Catalog: approved classes only</text><text x="495" y="192" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#bec9c6">Tenant budget and entitlement</text><text x="495" y="228" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#bec9c6">Residency, capacity, deadline</text><text x="495" y="264" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#bec9c6">Enforced outside the model</text><path d="M835,185 L910,185" fill="none" stroke="#efb45f" stroke-width="3" marker-end="url(#arrow)"/><rect x="930" y="70" width="330" height="230" rx="3" fill="none" stroke="#efb45f" stroke-width="3"/><text x="950" y="112" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#efb45f">Lease</text><text x="950" y="156" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#bec9c6">8 × sandbox-small</text><text x="950" y="192" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#bec9c6">egress: 3 domains</text><text x="950" y="228" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#bec9c6">one scoped credential</text><text x="950" y="264" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#bec9c6">expires 06:00 · teardown</text><line x1="20" y1="340" x2="1260" y2="340" stroke="#728482" stroke-width="1"/><text x="20" y="385" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#f5f1e9">Pay per job. No idle fleet. Least privilege for free: six minutes, three domains, one credential.</text><text x="20" y="425" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#efb45f">The agent chooses. It does not grant.</text><text x="20" y="463" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#bec9c6">An agent that can provision is an agent that can spend; the catalog, the lease and the teardown are the answer.</text></svg>
