<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 500" role="img" aria-labelledby="title desc"><title id="title">Adapt pressure within a fixed limit</title><desc id="desc">The scheduler reduces admission after throttling; every increase remains inside the approved maximum.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#efb45f"/></marker></defs><text x="20" y="40" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#efb45f" text-anchor="start">ILLUSTRATIVE BATCH POLICY</text><path d="M20,95 H1260" stroke="#728482" stroke-width="1"/><text x="20" y="145" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#f5f1e9" text-anchor="start">Maximum: 10</text><text x="20" y="205" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#f5f1e9" text-anchor="start"></text><rect x="300" y="140" width="150" height="200" fill="#efb45f"/><text x="375" y="320" font-family="Arial, Helvetica, sans-serif" font-size="34" fill="#122323" text-anchor="middle">10</text><text x="375" y="390" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#f5f1e9" text-anchor="middle">Initial</text><rect x="630" y="240" width="150" height="100" fill="#efb45f"/><text x="705" y="320" font-family="Arial, Helvetica, sans-serif" font-size="34" fill="#122323" text-anchor="middle">5</text><text x="705" y="390" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#f5f1e9" text-anchor="middle">After throttle</text><rect x="960" y="220" width="150" height="120" fill="#efb45f"/><text x="1035" y="320" font-family="Arial, Helvetica, sans-serif" font-size="34" fill="#122323" text-anchor="middle">6</text><text x="1035" y="390" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#f5f1e9" text-anchor="middle">After stable window</text><text x="20" y="470" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#bec9c6" text-anchor="start">The scheduler reduces admission after throttling; every increase remains inside the approved maximum.</text></svg>
