<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <filter id="cloud" x="-40%" y="-40%" width="180%" height="180%">
      <feTurbulence type="fractalNoise" baseFrequency=".004 .007" numOctaves="3" seed="24" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="160" xChannelSelector="R" yChannelSelector="G"/>
      <feGaussianBlur stdDeviation="42"/>
    </filter>
  </defs>
  <g filter="url(#cloud)">
    <ellipse cx="1370" cy="120" rx="560" ry="220" fill="#9eafb0" opacity=".6"/>
    <ellipse cx="-80" cy="390" rx="410" ry="290" fill="#c5ad87" opacity=".48"/>
    <ellipse cx="900" cy="-20" rx="530" ry="140" fill="#fffdf4"/>
    <ellipse cx="1420" cy="570" rx="370" ry="180" fill="#b5c5b4" opacity=".45"/>
    <ellipse cx="1280" cy="310" rx="400" ry="85" fill="#fffdf4" opacity=".9"/>
  </g>
</svg>
