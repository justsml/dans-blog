<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 920" role="img" aria-labelledby="title desc">
  <title id="title">The cost-quality frontier</title>
  <desc id="desc">Scatter plot comparing judge score and model cost for eight routes on the same hard Juice Shop task. GPT-5.6 Luna, DeepSeek V4 Flash, and Kimi K3 form the strict cost-quality frontier.</desc>
  <defs>
    <style>text{font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',sans-serif;fill:#262b2b}.title{font-family:Georgia,'Noto Serif',serif;font-size:36px;font-weight:400;letter-spacing:-.01em}.sub{font-size:17px;fill:#5e625c}.axis{font-size:13px;fill:#5e625c;font-variant-numeric:tabular-nums}.axis-title{font-size:13px;font-weight:700;letter-spacing:.06em;fill:#5e625c}.model{font-size:14px;font-weight:700}.metric{font-size:13px;fill:#5e625c;font-variant-numeric:tabular-nums}.plabel{font-size:13px;font-weight:600;fill:#5e625c}.note{font-size:13px;fill:#6b6e66}.grid{stroke:#ddd6c8;stroke-width:1;stroke-dasharray:3 6;shape-rendering:crispEdges}.frontier{fill:none;stroke:#386243;stroke-width:2.5;stroke-dasharray:8 7}.dot{stroke:#f8f4ec;stroke-width:2.5}.key{stroke:#fffaf2;stroke-width:2}.sage{fill:#386243}.slate{fill:#314f5b}.ochre{fill:#7e581f}.vermilion{fill:#a2392b}.callout{fill:#fffaf2;stroke:#386243;stroke-width:1.25}.callout-name{font-size:14px;font-weight:700;fill:#386243}.lead{font-size:15px;font-weight:700}</style>
  </defs>
  <rect x=".75" y=".75" width="1438.5" height="918.5" rx="12" fill="#f8f4ec" stroke="#cec7bb" stroke-width="1.5"/>
  <rect x="72" y="40" width="56" height="3" fill="#96492f"/>
  <text class="title" x="72" y="84">The cost-quality frontier</text><text class="sub" x="72" y="116">Same hard target · judge score × model cost · logarithmic cost axis · every value directly labeled</text>
  <g transform="translate(0 0)">
    <line class="grid" x1="110" y1="170" x2="950" y2="170"/><line class="grid" x1="110" y1="278" x2="950" y2="278"/><line class="grid" x1="110" y1="386" x2="950" y2="386"/><line class="grid" x1="110" y1="494" x2="950" y2="494"/><line class="grid" x1="110" y1="602" x2="950" y2="602"/><line x1="110" y1="170" x2="110" y2="710" stroke="#8d8a80"/><line x1="110" y1="710" x2="950" y2="710" stroke="#8d8a80"/>
    <g class="axis" text-anchor="end"><text x="98" y="174">10</text><text x="98" y="282">9</text><text x="98" y="390">8</text><text x="98" y="498">7</text><text x="98" y="606">6</text><text x="98" y="714">5</text></g>
    <g class="axis" text-anchor="middle"><text x="145" y="736">$0.016</text><text x="340" y="736">$0.059</text><text x="430" y="736">$0.086</text><text x="620" y="736">$0.22</text><text x="900" y="736">$1.63</text></g>
    <text class="axis-title" x="530" y="770" text-anchor="middle">MODEL COST · LOGARITHMIC SCALE</text><text class="axis-title" transform="translate(58 440) rotate(-90)" text-anchor="middle">JUDGE SCORE / 10</text>
    <path class="frontier" d="M145 314 L340 242 L620 170"/>
    <circle class="dot sage" cx="145" cy="314" r="10"/><circle class="dot vermilion" cx="355" cy="710" r="8"/><circle class="dot sage" cx="340" cy="242" r="10"/><circle class="dot vermilion" cx="430" cy="656" r="8"/><circle class="dot ochre" cx="500" cy="386" r="8"/><circle class="dot sage" cx="620" cy="170" r="10"/><circle class="dot ochre" cx="700" cy="386" r="8"/><circle class="dot slate" cx="900" cy="170" r="8"/>
    <g class="plabel"><text x="900" y="200" text-anchor="middle">Claude Opus 4.8</text><text x="514" y="372">GPT-5.6 Terra</text><text x="714" y="372">GPT-5.6 Sol</text><text x="444" y="651">Qwen 3.6 Flash</text><text x="369" y="696">GPT OSS 120B</text></g>
    <g transform="translate(122 334)"><rect class="callout" width="206" height="58" rx="10"/><text class="callout-name" x="14" y="23">GPT-5.6 Luna</text><text class="metric" x="14" y="44">8.67/10 · $0.016304</text></g>
    <g transform="translate(128 160)"><rect class="callout" width="220" height="58" rx="10"/><text class="callout-name" x="14" y="23">DeepSeek V4 Flash</text><text class="metric" x="14" y="44">9.33/10 · $0.058695</text></g>
    <path d="M620 170 L645 154" fill="none" stroke="#7a7c74" stroke-width="1.5"/>
    <g transform="translate(645 126)"><rect class="callout" width="210" height="58" rx="10"/><text class="callout-name" x="14" y="23">Kimi K3</text><text class="metric" x="14" y="44">10.0/10 · $0.220184</text></g>
  </g>
  <g transform="translate(982 156)">
    <rect width="386" height="574" rx="16" fill="#fffaf2" stroke="#cec7bb" stroke-width="1.25"/><text class="axis-title" x="22" y="34">DIRECT LABELS · SCORE / COST / RUNTIME</text>
    <g transform="translate(24 74)"><circle class="key sage" cx="7" cy="7" r="6"/><text class="model" x="26" y="12">Kimi K3</text><text class="metric" x="340" y="12" text-anchor="end">10 · $0.220184 · 223s</text></g>
    <g transform="translate(24 134)"><circle class="key slate" cx="7" cy="7" r="6"/><text class="model" x="26" y="12">Claude Opus 4.8</text><text class="metric" x="340" y="12" text-anchor="end">10 · $1.633301 · 116s</text></g>
    <g transform="translate(24 194)"><circle class="key sage" cx="7" cy="7" r="6"/><text class="model" x="26" y="12">DeepSeek V4 Flash</text><text class="metric" x="340" y="12" text-anchor="end">9.33 · $0.058695 · 396s</text></g>
    <g transform="translate(24 254)"><circle class="key sage" cx="7" cy="7" r="6"/><text class="model" x="26" y="12">GPT-5.6 Luna</text><text class="metric" x="340" y="12" text-anchor="end">8.67 · $0.016304 · 52s</text></g>
    <g transform="translate(24 314)"><circle class="key ochre" cx="7" cy="7" r="6"/><text class="model" x="26" y="12">GPT-5.6 Terra</text><text class="metric" x="340" y="12" text-anchor="end">8 · $0.124046 · 108s</text></g>
    <g transform="translate(24 374)"><circle class="key ochre" cx="7" cy="7" r="6"/><text class="model" x="26" y="12">GPT-5.6 Sol</text><text class="metric" x="340" y="12" text-anchor="end">8 · $0.368514 · 230s</text></g>
    <g transform="translate(24 434)"><circle class="key vermilion" cx="7" cy="7" r="6"/><text class="model" x="26" y="12">Qwen 3.6 Flash</text><text class="metric" x="340" y="12" text-anchor="end">5.5 · $0.085678 · 97s</text></g>
    <g transform="translate(24 494)"><circle class="key vermilion" cx="7" cy="7" r="6"/><text class="model" x="26" y="12">GPT OSS 120B</text><text class="metric" x="340" y="12" text-anchor="end">5 · $0.062529 · 37s</text></g>
  </g>
  <g transform="translate(72 798)"><rect width="1296" height="58" rx="14" fill="#efe9dd" stroke="#d8d0c2"/><text class="lead" x="22" y="25">Only Luna, DeepSeek, and Kimi survive the strict cost-quality test.</text><text class="note" x="22" y="46">Opus remains useful when speed matters: it matches Kimi's score and finishes about 1.9× faster.</text></g>
  <text class="note" x="72" y="886">ExploitHunter hard Juice Shop · judge score × model cost</text>
</svg>
