      <g transform="translate(0 320)"><text class="row" x="-28" y="34" text-anchor="end">GPT-5.6 Sol</text><rect class="neutral" width="200" height="52" rx="10"/><text class="value" x="100" y="33" text-anchor="middle">8.0 / 10</text><rect class="warn" x="216" width="200" height="52" rx="10"/><text class="value" x="316" y="33" text-anchor="middle">$0.368514</text><rect class="mid" x="432" width="200" height="52" rx="10"/><text class="value" x="532" y="33" text-anchor="middle">229.6s</text><rect class="mid" x="648" width="200" height="52" rx="10"/><text class="value" x="748" y="33" text-anchor="middle">10.0</text></g>
      <g transform="translate(0 384)"><text class="row" x="-28" y="34" text-anchor="end">Qwen 3.6 Flash</text><rect class="warn" width="200" height="52" rx="10"/><text class="value" x="100" y="33" text-anchor="middle">5.5 / 10</text><rect class="strong" x="216" width="200" height="52" rx="10"/><text class="value" x="316" y="33" text-anchor="middle">$0.085678</text><rect class="strong" x="432" width="200" height="52" rx="10"/><text class="value" x="532" y="33" text-anchor="middle">96.9s</text><rect class="mid" x="648" width="200" height="52" rx="10"/><text class="value" x="748" y="33" text-anchor="middle">16.5</text></g>
      <g transform="translate(0 448)"><text class="row" x="-28" y="34" text-anchor="end">GPT OSS 120B</text><rect class="warn" width="200" height="52" rx="10"/><text class="value" x="100" y="33" text-anchor="middle">5.0 / 10</text><rect class="strong" x="216" width="200" height="52" rx="10"/><text class="value" x="316" y="33" text-anchor="middle">$0.062529</text><rect class="top" x="432" width="200" height="52" rx="10"/><text class="value on" x="532" y="33" text-anchor="middle">36.6s</text><rect class="top" x="648" width="200" height="52" rx="10"/><text class="value on" x="748" y="33" text-anchor="middle">4.3</text></g>
    </g>
  </g>
  <g transform="translate(72 790)"><rect width="1296" height="58" rx="14" fill="#efe9dd" stroke="#d8d0c2"/><text class="lead" x="22" y="25">Kimi wins top-score value. Opus wins top-score speed. Luna wins efficiency.</text><text class="note" x="22" y="46">DeepSeek reaches 9.33/10; GPT OSS is fastest but falls to 5/10.</text></g>
  <text class="note" x="72" y="880">ExploitHunter hard Juice Shop · judge score · model cost · runtime · tool calls</text>
</svg>
