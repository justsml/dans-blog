<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 920" role="img" aria-labelledby="title desc">
  <title id="title">Hard-target model comparison</title>
  <desc id="desc">Eight model routes compared on the same hard Juice Shop task by judge score, model cost, runtime, and tool calls. Kimi K3 and Claude Opus 4.8 score ten of ten. DeepSeek V4 Flash scores 9.33. GPT-5.6 Luna has the strongest efficiency result.</desc>
  <defs>
    <style>text{font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',sans-serif;fill:#262b2b}.title{font-family:Georgia,'Noto Serif',serif;font-size:36px;font-weight:400;letter-spacing:-.01em}.sub{font-size:17px;fill:#5e625c}.head{font-size:13px;font-weight:700;letter-spacing:.06em;fill:#5e625c}.row{font-size:17px;font-weight:600}.value{font-size:16px;font-weight:700;font-variant-numeric:tabular-nums}.note{font-size:13px;fill:#6b6e66}.top{fill:#386243;stroke:#386243;stroke-width:1.5}.strong{fill:#dfe7e8;stroke:#8fa8b0;stroke-width:1}.mid{fill:#f0e4cc;stroke:#c9a96e;stroke-width:1}.warn{fill:#f4ded6;stroke:#d39a8d;stroke-width:1}.neutral{fill:#fffaf2;stroke:#cec7bb;stroke-width:1}.on{fill:#fffaf2}.lead{font-size:15px;font-weight:700}</style>
  </defs>
  <rect x=".75" y=".75" width="1438.5" height="918.5" rx="12" fill="#f8f4ec" stroke="#cec7bb" stroke-width="1.5"/>
  <rect x="72" y="40" width="56" height="3" fill="#96492f"/>
  <text class="title" x="72" y="84">Hard-target model comparison</text><text class="sub" x="72" y="116">Same ExploitHunter browser task · judge score · model cost · runtime · tool calls</text>
