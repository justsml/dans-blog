    <g transform="translate(0 52)">
      <g transform="translate(0 0)"><text class="row" x="-28" y="34" text-anchor="end">Kimi K3</text><rect class="top" width="200" height="52" rx="10"/><text class="value on" x="100" y="33" text-anchor="middle">10.0 / 10</text><rect class="top" x="216" width="200" height="52" rx="10"/><text class="value on" x="316" y="33" text-anchor="middle">$0.220184</text><rect class="mid" x="432" width="200" height="52" rx="10"/><text class="value" x="532" y="33" text-anchor="middle">223.4s</text><rect class="neutral" x="648" width="200" height="52" rx="10"/><text class="value" x="748" y="33" text-anchor="middle">8.0</text></g>
      <g transform="translate(0 64)"><text class="row" x="-28" y="34" text-anchor="end">Claude Opus 4.8</text><rect class="top" width="200" height="52" rx="10"/><text class="value on" x="100" y="33" text-anchor="middle">10.0 / 10</text><rect class="warn" x="216" width="200" height="52" rx="10"/><text class="value" x="316" y="33" text-anchor="middle">$1.633301</text><rect class="strong" x="432" width="200" height="52" rx="10"/><text class="value" x="532" y="33" text-anchor="middle">115.9s</text><rect class="neutral" x="648" width="200" height="52" rx="10"/><text class="value" x="748" y="33" text-anchor="middle">8.0</text></g>
      <g transform="translate(0 128)"><text class="row" x="-28" y="34" text-anchor="end">DeepSeek V4 Flash</text><rect class="strong" width="200" height="52" rx="10"/><text class="value" x="100" y="33" text-anchor="middle">9.33 / 10</text><rect class="strong" x="216" width="200" height="52" rx="10"/><text class="value" x="316" y="33" text-anchor="middle">$0.058695</text><rect class="mid" x="432" width="200" height="52" rx="10"/><text class="value" x="532" y="33" text-anchor="middle">395.5s</text><rect class="mid" x="648" width="200" height="52" rx="10"/><text class="value" x="748" y="33" text-anchor="middle">32.0</text></g>
