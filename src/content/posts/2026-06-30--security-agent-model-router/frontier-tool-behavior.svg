<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 920" role="img" aria-labelledby="title desc">
  <title id="title">Kimi wins on cost, Opus wins on speed</title>
  <desc id="desc">Kimi K3 and Claude Opus 4.8 both score ten of ten on the same hard Juice Shop task and use eight tool calls. Kimi costs 0.220184 dollars and takes 223.4 seconds. Opus costs 1.633301 dollars and takes 115.9 seconds.</desc>
  <defs>
    <style>text{font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',sans-serif;fill:#262b2b}.title{font-family:Georgia,'Noto Serif',serif;font-size:36px;font-weight:400;letter-spacing:-.01em}.sub{font-size:17px;fill:#5e625c}.eyebrow{font-size:13px;font-weight:700;letter-spacing:.06em;fill:#5e625c}.model{font-family:Georgia,'Noto Serif',serif;font-size:28px;font-weight:400;letter-spacing:-.01em}.big{font-size:35px;font-weight:600;font-variant-numeric:tabular-nums}.metric{font-size:15px;fill:#5e625c}.small{font-size:14px;fill:#5e625c;font-variant-numeric:tabular-nums}.note{font-size:13px;fill:#6b6e66}.card{fill:#fffaf2;stroke:#cec7bb;stroke-width:1.25}.chip{fill:#fffaf2;stroke:#cec7bb;stroke-width:1}.track{fill:#efe9dd}.sage{fill:#386243}.slate{fill:#314f5b}.ochre{fill:#7e581f}.vermilion{fill:#a2392b}.adv{font-size:19px;font-weight:700}.chip-name{font-size:17px;font-weight:700}.lead{font-size:15px;font-weight:700}</style>
    <clipPath id="card-l"><rect width="620" height="420" rx="18"/></clipPath>
    <clipPath id="chip-c"><rect width="300" height="112" rx="14"/></clipPath>
  </defs>
  <rect x=".75" y=".75" width="1438.5" height="918.5" rx="12" fill="#f8f4ec" stroke="#cec7bb" stroke-width="1.5"/>
  <rect x="72" y="40" width="56" height="3" fill="#96492f"/>
  <text class="title" x="72" y="84">Kimi wins on cost. Opus wins on speed.</text><text class="sub" x="72" y="116">Same hard target · both score 10/10 · both use eight tool calls</text>
  <g transform="translate(72 154)">
    <rect class="card" width="620" height="420" rx="18"/><rect class="sage" width="620" height="5" clip-path="url(#card-l)"/><g transform="translate(30 32)"><text class="eyebrow">TOP-SCORE VALUE</text><text class="model sage" y="46">Kimi K3</text><text class="big sage" y="104">10.0 / 10</text><text class="metric" y="132">full judge score on the hard browser task</text><rect class="track" y="158" width="560" height="18" rx="9"/><rect class="sage" y="158" width="560" height="18" rx="9"/>
      <g transform="translate(0 222)"><text class="eyebrow">MODEL COST</text><text class="big" y="44">$0.220184</text></g><g transform="translate(292 222)"><text class="eyebrow">RUNTIME</text><text class="big" y="44">223.4s</text></g>
      <g transform="translate(0 326)"><text class="eyebrow">TOOL CALLS</text><text x="0" y="36" font-size="25" font-weight="600">8</text></g><g transform="translate(292 326)"><text class="eyebrow">ADVANTAGE</text><text class="adv sage" x="0" y="36">7.4× cheaper</text></g>
    </g>
    <g transform="translate(676 0)"><rect class="card" width="620" height="420" rx="18"/><rect class="slate" width="620" height="5" clip-path="url(#card-l)"/><g transform="translate(30 32)"><text class="eyebrow">TOP-SCORE SPEED</text><text class="model slate" y="46">Claude Opus 4.8</text><text class="big slate" y="104">10.0 / 10</text><text class="metric" y="132">full judge score on the hard browser task</text><rect class="track" y="158" width="560" height="18" rx="9"/><rect class="slate" y="158" width="560" height="18" rx="9"/>
      <g transform="translate(0 222)"><text class="eyebrow">MODEL COST</text><text class="big" y="44">$1.633301</text></g><g transform="translate(292 222)"><text class="eyebrow">RUNTIME</text><text class="big" y="44">115.9s</text></g>
      <g transform="translate(0 326)"><text class="eyebrow">TOOL CALLS</text><text x="0" y="36" font-size="25" font-weight="600">8</text></g><g transform="translate(292 326)"><text class="eyebrow">ADVANTAGE</text><text class="adv slate" x="0" y="36">1.9× faster</text></g>
    </g>
  </g>
  </g>
  <g transform="translate(72 610)">
    <g><rect class="chip" width="300" height="112" rx="14"/><rect class="sage" width="4" height="112" clip-path="url(#chip-c)"/><text class="eyebrow" x="18" y="28">EFFICIENCY LEADER</text><text class="chip-name sage" x="18" y="57">GPT-5.6 Luna</text><text class="small" x="18" y="84">8.67/10 · $0.016304 · 52.2s</text></g>
    <g transform="translate(324)"><rect class="chip" width="300" height="112" rx="14"/><rect class="sage" width="4" height="112" clip-path="url(#chip-c)"/><text class="eyebrow" x="18" y="28">QUALITY STEP-UP</text><text class="chip-name sage" x="18" y="57">DeepSeek V4 Flash</text><text class="small" x="18" y="84">9.33/10 · $0.058695 · 395.5s</text></g>
    <g transform="translate(648)"><rect class="chip" width="300" height="112" rx="14"/><rect class="ochre" width="4" height="112" clip-path="url(#chip-c)"/><text class="eyebrow" x="18" y="28">FAMILY VALUE</text><text class="chip-name ochre" x="18" y="57">GPT-5.6 Terra</text><text class="small" x="18" y="84">Same 8/10 as Sol · 66% cheaper</text></g>
    <g transform="translate(972)"><rect class="chip" width="300" height="112" rx="14"/><rect class="vermilion" width="4" height="112" clip-path="url(#chip-c)"/><text class="eyebrow" x="18" y="28">SUPERVISED ONLY</text><text class="chip-name vermilion" x="18" y="57">GPT OSS 120B</text><text class="small" x="18" y="84">5/10 · $0.062529 · 36.6s</text></g>
  </g>
  <g transform="translate(72 758)"><rect width="1296" height="72" rx="14" fill="#efe9dd" stroke="#d8d0c2"/><text class="lead" x="22" y="29">At the top, the routing choice is brutally simple.</text><text class="note" x="22" y="52">Choose Kimi when cost matters. Choose Opus when saving about 108 seconds is worth another $1.41.</text></g>
  <text class="note" x="72" y="880">ExploitHunter hard Juice Shop · judge score · model cost · runtime · tool calls</text>
</svg>
