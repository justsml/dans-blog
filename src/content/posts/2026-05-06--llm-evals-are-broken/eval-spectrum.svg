<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">The eval spectrum</title>
  <desc id="desc">A spectrum comparing deterministic checks, LLM-as-judge, and human evaluation by speed, cost, and validity.</desc>
  <defs>
    <clipPath id="railClip"><rect x="48" y="214" width="1104" height="12" rx="6"/></clipPath>
    <clipPath id="clipDet"><rect x="48" y="290" width="336" height="238" rx="12"/></clipPath>
    <clipPath id="clipJudge"><rect x="432" y="290" width="336" height="238" rx="12"/></clipPath>
    <clipPath id="clipHuman"><rect x="816" y="290" width="336" height="238" rx="12"/></clipPath>
    <style>
      .sheet { fill: #f8f4ec; stroke: #cec7bb; stroke-width: 1.5; }
      .footer { fill: #efe9dd; stroke: #d8d0c2; stroke-width: 1; }
      .rule { fill: #96492f; }
      .card { fill: #fffaf2; stroke: #cec7bb; stroke-width: 1.5; }
      .drop { stroke: #7a7c74; stroke-width: 1.5; stroke-dasharray: 3 5; }
      .dot { stroke: #f8f4ec; stroke-width: 2.5; }
      .slate { fill: #314f5b; }
      .sage { fill: #386243; }
      .vermilion { fill: #a2392b; }
      .title { fill: #262b2b; font-family: Georgia, 'Noto Serif', serif; font-size: 46px; font-weight: 400; letter-spacing: -.01em; }
      .label { fill: #262b2b; font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', sans-serif; font-size: 26px; font-weight: 700; letter-spacing: 0; }
      .small { fill: #5e625c; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 18px; letter-spacing: 0; }
      .axis { fill: #5e625c; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 18px; letter-spacing: 0; }
      .note { fill: #6b6e66; }
      .value { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 17px; font-weight: 700; letter-spacing: 0; }
    </style>
  </defs>
  <rect class="sheet" x="0.75" y="0.75" width="1198.5" height="673.5" rx="12"/>
  <text class="title" x="48" y="90">The Eval Spectrum</text>
  <rect class="rule" x="48" y="112" width="96" height="3"/>

  <text class="axis" x="48" y="186">fast / cheap / narrow</text>
  <text class="axis" x="1152" y="186" text-anchor="end">slow / costly / valid</text>

  <!-- stepped rail: one band per eval family -->
  <g clip-path="url(#railClip)">
    <rect class="slate" x="48" y="214" width="360" height="12"/>
    <rect class="sage" x="408" y="214" width="384" height="12"/>
    <rect class="vermilion" x="792" y="214" width="360" height="12"/>
  </g>
  <path class="drop" d="M216 232V284M600 232V284M984 232V284"/>
  <circle class="dot slate" cx="216" cy="220" r="10"/>
  <circle class="dot sage" cx="600" cy="220" r="10"/>
  <circle class="dot vermilion" cx="984" cy="220" r="10"/>

  <rect class="card" x="48" y="290" width="336" height="238" rx="12"/>
  <rect class="card" x="432" y="290" width="336" height="238" rx="12"/>
  <rect class="card" x="816" y="290" width="336" height="238" rx="12"/>
  <rect class="slate" x="48" y="290" width="336" height="6" clip-path="url(#clipDet)"/>
  <rect class="sage" x="432" y="290" width="336" height="6" clip-path="url(#clipJudge)"/>
  <rect class="vermilion" x="816" y="290" width="336" height="6" clip-path="url(#clipHuman)"/>

  <g>
    <text class="label" x="76" y="346">Deterministic checks</text>
    <text class="small" x="76" y="392">JSON parses</text>
    <text class="small" x="76" y="423">citations grounded</text>
    <text class="small" x="76" y="454">schema-safe SQL</text>
    <text class="value slate" x="76" y="500">Best for known failures</text>
  </g>
  <g>
    <text class="label" x="460" y="346">LLM-as-judge</text>
    <text class="small" x="460" y="392">helpfulness</text>
    <text class="small" x="460" y="423">summary quality</text>
    <text class="small" x="460" y="454">rubric scoring</text>
    <text class="value sage" x="460" y="500">Useful, not a court</text>
  </g>
  <g>
    <text class="label" x="844" y="346">Human eval</text>
    <text class="small" x="844" y="392">real judgment</text>
    <text class="small" x="844" y="423">domain taste</text>
    <text class="small" x="844" y="454">business fit</text>
    <text class="value vermilion" x="844" y="500">Gold standard, spendy</text>
  </g>

  <rect class="footer" x="48" y="578" width="1104" height="48" rx="8"/>
  <text class="axis note" x="72" y="608">Use the cheapest test that can honestly catch the failure.</text>
</svg>
