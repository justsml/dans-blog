<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Golden set lifecycle</title>
  <desc id="desc">A workflow from incident capture through golden cases, CI eval runs, and blocked regressions.</desc>
  <defs>
    <marker id="headSlate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1 1L11 6L1 11z" fill="#314f5b"/>
    </marker>
    <marker id="headSage" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1 1L11 6L1 11z" fill="#386243"/>
    </marker>
    <marker id="headVermilion" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1 1L11 6L1 11z" fill="#a2392b"/>
    </marker>
    <clipPath id="clipFailure"><rect x="48" y="168" width="290" height="160" rx="12"/></clipPath>
    <clipPath id="clipGolden"><rect x="278" y="388" width="320" height="160" rx="12"/></clipPath>
    <clipPath id="clipCI"><rect x="538" y="168" width="280" height="160" rx="12"/></clipPath>
    <clipPath id="clipShip"><rect x="878" y="168" width="274" height="160" rx="12"/></clipPath>
    <clipPath id="clipReg"><rect x="878" y="388" width="274" height="160" rx="12"/></clipPath>
    <style>
      .sheet { fill: #f8f4ec; stroke: #cec7bb; stroke-width: 1.5; }
      .footer { fill: #efe9dd; stroke: #d8d0c2; stroke-width: 1; }
      .rule { fill: #96492f; }
      .box { fill: #fffaf2; stroke: #cec7bb; stroke-width: 1.5; }
      .flow { fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .flowSlate { stroke: #314f5b; }
      .flowSage { stroke: #386243; }
      .flowVermilion { stroke: #a2392b; }
      .title { fill: #262b2b; font-family: Georgia, 'Noto Serif', serif; font-size: 46px; font-weight: 400; letter-spacing: -.01em; }
      .label { fill: #262b2b; font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', sans-serif; font-size: 27px; font-weight: 700; letter-spacing: 0; }
      .small { fill: #5e625c; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 16px; letter-spacing: 0; }
      .note { fill: #6b6e66; }
      .tag { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 15px; font-weight: 700; letter-spacing: .02em; }
      .stripSlate { fill: #314f5b; }
      .stripSage { fill: #386243; }
      .stripVermilion { fill: #a2392b; }
      .chipSlate, .chipSage, .chipVermilion { stroke-width: 1; }
      .chipSlate { fill: #dfe7e8; stroke: #314f5b; }
      .chipSage { fill: #e1eadb; stroke: #386243; }
      .chipVermilion { fill: #f4ded6; stroke: #a2392b; }
      .tagSlate { fill: #314f5b; }
      .tagSage { fill: #386243; }
      .tagVermilion { fill: #a2392b; }
    </style>
  </defs>
  <rect class="sheet" x="0.75" y="0.75" width="1198.5" height="673.5" rx="12"/>
  <text class="title" x="48" y="90">Build the Golden Set From Bad Days</text>
  <rect class="rule" x="48" y="112" width="96" height="3"/>

  <!-- flow connectors (drawn under cards) -->
  <path class="flow flowSlate" d="M160 330C160 420 196 468 274 468" marker-end="url(#headSlate)"/>
  <path class="flow flowSlate" d="M598 468C652 468 690 432 690 333" marker-end="url(#headSlate)"/>
  <path class="flow flowSage" d="M818 248H873" marker-end="url(#headSage)"/>
  <path class="flow flowVermilion" d="M760 330C760 420 796 468 873 468" marker-end="url(#headVermilion)"/>

  <!-- Failure -->
  <g>
    <rect class="box" x="48" y="168" width="290" height="160" rx="12"/>
    <rect class="stripVermilion" x="48" y="168" width="290" height="6" clip-path="url(#clipFailure)"/>
    <rect class="chipVermilion" x="76" y="198" width="92" height="28" rx="14"/>
    <text class="tag tagVermilion" x="122" y="217" text-anchor="middle">incident</text>
    <text class="label" x="76" y="268">Failure</text>
    <text class="small" x="76" y="302">ticket, flag, screenshot</text>
  </g>

  <!-- Golden case -->
  <g>
    <rect class="box" x="278" y="388" width="320" height="160" rx="12"/>
    <rect class="stripSlate" x="278" y="388" width="320" height="6" clip-path="url(#clipGolden)"/>
    <rect class="chipSlate" x="306" y="418" width="84" height="28" rx="14"/>
    <text class="tag tagSlate" x="348" y="437" text-anchor="middle">capture</text>
    <text class="label" x="306" y="488">Golden case</text>
    <text class="small" x="306" y="522">input + context + expected</text>
  </g>

  <!-- CI eval -->
  <g>
    <rect class="box" x="538" y="168" width="280" height="160" rx="12"/>
    <rect class="stripSlate" x="538" y="168" width="280" height="6" clip-path="url(#clipCI)"/>
    <rect class="chipSlate" x="566" y="198" width="56" height="28" rx="14"/>
    <text class="tag tagSlate" x="594" y="217" text-anchor="middle">run</text>
    <text class="label" x="566" y="268">CI eval</text>
    <text class="small" x="566" y="302">baseline vs candidate</text>
  </g>

  <!-- Ship -->
  <g>
    <rect class="box" x="878" y="168" width="274" height="160" rx="12"/>
    <rect class="stripSage" x="878" y="168" width="274" height="6" clip-path="url(#clipShip)"/>
    <rect class="chipSage" x="906" y="198" width="62" height="28" rx="14"/>
    <text class="tag tagSage" x="937" y="217" text-anchor="middle">ship</text>
    <text class="label" x="906" y="268">No known</text>
    <text class="label" x="906" y="302">breaks</text>
  </g>

  <!-- Regression -->
  <g>
    <rect class="box" x="878" y="388" width="274" height="160" rx="12"/>
    <rect class="stripVermilion" x="878" y="388" width="274" height="6" clip-path="url(#clipReg)"/>
    <rect class="chipVermilion" x="906" y="418" width="70" height="28" rx="14"/>
    <text class="tag tagVermilion" x="941" y="437" text-anchor="middle">block</text>
    <text class="label" x="906" y="488">Regression</text>
    <text class="small" x="906" y="522">specific, reproducible</text>
  </g>

  <rect class="footer" x="48" y="578" width="1104" height="48" rx="8"/>
  <text class="small note" x="72" y="608">The point is not a perfect test suite. The point is remembering your own failures.</text>
</svg>
