<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Two dimensions of agent workloads</title>
  <desc id="desc">Conceptual, undated illustration of task difficulty and orchestration scale. Human-baseline task duration is distinct from agent runtime; runtime times workers gives a work budget, not a capability law.</desc>
  <defs>
    <style>text{font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',sans-serif;fill:#262b2b}.title{font-family:Georgia,'Noto Serif',serif;font-size:40px;font-weight:400;letter-spacing:-.01em}.sub{font-size:17px;fill:#5e625c}.axis{font-size:13px;fill:#5e625c;font-variant-numeric:tabular-nums}.caps{font-weight:700;letter-spacing:.06em}.curve{fill:none;stroke-width:4;stroke-linecap:round}.land{font-size:14.5px;font-weight:700}.landp{font-size:13px;fill:#5e625c}.prod{font-size:14px;font-weight:700;letter-spacing:.06em;fill:#a2392b}.note{font-size:13.5px;fill:#6b6e66}.grid{stroke:#ddd6c8;stroke-width:1;stroke-dasharray:3 6;shape-rendering:crispEdges}.lead{stroke:#7a7c74;stroke-width:1.25;fill:none}.dot{stroke:#f8f4ec;stroke-width:2.5}.slate{fill:#314f5b}.sage{fill:#386243}.verm{fill:#a2392b}.card{fill:#fffaf2;stroke:#cec7bb;stroke-width:1.25}.inner{fill:#f8f4ec;stroke:#d8d0c2;stroke-width:1}</style>
  </defs>
  <rect x=".75" y=".75" width="1598.5" height="898.5" rx="12" fill="#f8f4ec" stroke="#cec7bb" stroke-width="1.5"/>
  <rect x="72" y="40" width="1456" height="3" fill="#96492f"/>
  <text class="title" x="72" y="92">Two dimensions of agent workloads</text><text class="sub" x="72" y="124">Task difficulty and orchestration scale · conceptual shapes, not measured trends or forecasts</text>
  <g>
    <rect x="760" y="180" width="240" height="520" fill="#f4ded6" opacity=".6"/>
    <line class="grid" x1="130" y1="220" x2="1000" y2="220"/><line class="grid" x1="130" y1="340" x2="1000" y2="340"/><line class="grid" x1="130" y1="460" x2="1000" y2="460"/><line class="grid" x1="130" y1="580" x2="1000" y2="580"/>
    <line x1="130" y1="180" x2="130" y2="700" stroke="#8d8a80" stroke-width="1.25"/><line x1="130" y1="700" x2="1000" y2="700" stroke="#8d8a80" stroke-width="1.25"/>
    <text class="prod" x="774" y="636">POTENTIAL WORKLOAD</text><text class="landp" x="774" y="657">more complex tasks, more workers</text><text class="landp" x="774" y="676">subject to limits and coordination</text>
    <path class="curve" stroke="#314f5b" d="M130 692 C 340 688, 520 664, 640 610 S 860 470, 980 250"/>
    <path class="curve" stroke="#386243" stroke-dasharray="12 9" d="M130 696 C 300 694, 460 690, 560 668 S 760 560, 880 400 S 960 260, 990 220"/>
    <path class="lead" d="M612 534 L634 602"/>
    <path class="lead" d="M796 233 L968 248"/>
    <path class="lead" d="M750 345 L869 396"/>
    <circle class="slate dot" cx="640" cy="610" r="8"/><circle class="slate dot" cx="980" cy="250" r="10"/>
    <circle class="sage dot" cx="880" cy="400" r="8"/>
    <g transform="translate(400 480)"><rect class="card" width="212" height="66" rx="8" stroke="#8fa8b0"/><text class="land" x="14" y="25" style="fill:#314f5b">Human-baseline time</text><text class="landp" x="14" y="47">not elapsed agent runtime</text></g>
    <g transform="translate(560 200)"><rect class="card" width="236" height="66" rx="8" stroke="#8fa8b0"/><text class="land" x="14" y="25" style="fill:#314f5b">Task difficulty</text><text class="landp" x="14" y="47">at a specified success rate</text></g>
    <g transform="translate(520 312)"><rect class="card" width="230" height="66" rx="8" stroke="#9dbb96"/><text class="land" x="14" y="25" style="fill:#386243">Orchestration scale</text><text class="landp" x="14" y="47">workers and coordination limits</text></g>
    <text class="axis" x="130" y="726" text-anchor="middle">Earlier</text><text class="axis" x="380" y="726" text-anchor="middle"> </text><text class="axis" x="640" y="726" text-anchor="middle"> </text><text class="axis" x="880" y="726" text-anchor="middle">Later</text>
    <text class="axis caps" x="565" y="756" text-anchor="middle">CONCEPTUAL PROGRESSION · NO DATES</text>
    <text class="axis caps" transform="translate(100 440) rotate(-90)" text-anchor="middle">SEPARATE DIMENSIONS · NO SHARED UNITS</text>
    <g transform="translate(150 296)"><circle class="slate" cx="8" cy="8" r="7"/><text class="land" x="30" y="13" style="fill:#314f5b">Task difficulty</text><text class="landp" x="30" y="33">human task time at fixed success rate</text></g>
    <g transform="translate(150 246)"><circle class="sage" cx="8" cy="8" r="7"/><text class="land" x="30" y="13" style="fill:#386243">Orchestration scale</text><text class="landp" x="30" y="33">useful work across multiple agents</text></g>
  </g>
  <g transform="translate(1080 156)">
    <rect class="card" width="440" height="560" rx="12"/>
    <text class="caps" x="24" y="38" font-size="14" style="fill:#262b2b">ILLUSTRATIVE WORK BUDGET</text>
    <g transform="translate(24 66)"><rect class="inner" width="392" height="118" rx="8"/><rect width="4" height="118" rx="2" fill="#8d8a80"/><text class="land" x="20" y="32">8 hours × 1 worker = 8 worker-hours</text><text class="landp" x="20" y="56">A hypothetical allocation of runtime.</text><text class="landp" x="20" y="76">Not a METR horizon or a measured</text><text class="landp" x="20" y="96">intrusion success rate.</text></g>
    <g transform="translate(24 204)"><rect class="inner" width="392" height="118" rx="8"/><rect width="4" height="118" rx="2" fill="#386243"/><text class="land" x="20" y="32" style="fill:#386243">8 hours × 30 workers = 240 worker-hours</text><text class="landp" x="20" y="56">Assumes resources and parallel work.</text><text class="landp" x="20" y="76">Coordination overhead and correlated</text><text class="landp" x="20" y="96">failures can reduce useful output.</text></g>
    <g transform="translate(24 342)"><rect class="inner" width="392" height="118" rx="8"/><rect width="4" height="118" rx="2" fill="#a2392b"/><text class="land" x="20" y="32" style="fill:#a2392b">GTG-1002: ~30 targets</text><text class="landp" x="20" y="56">Anthropic reported a campaign scope.</text><text class="landp" x="20" y="76">That is not a worker count, measured</text><text class="landp" x="20" y="96">concurrency, or an eight-hour run.</text></g>
    <g transform="translate(24 484)"><rect width="392" height="50" rx="8" fill="#e1eadb" stroke="#9dbb96"/><text class="land" x="20" y="31" style="fill:#386243">Work budget ≠ guaranteed capability.</text></g>
  </g>
  <g transform="translate(72 776)"><rect width="1456" height="66" rx="10" fill="#efe9dd" stroke="#d8d0c2"/><text x="22" y="28" font-size="15" font-weight="700">More capable tasks and wider orchestration can increase attacker workload capacity.</text><text class="note" x="22" y="50">Sources: METR human-baseline task horizons; Anthropic GTG-1002 campaign report. No measured breadth doubling rate is implied.</text></g>
  <text class="note" x="72" y="872">No Fate But What We Bill · figure 1 · task difficulty and orchestration scale</text>
</svg>
