<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1444" role="img" aria-labelledby="title desc">
  <title id="title">Two dimensions of agent workloads</title>
  <desc id="desc">Illustrative, undated sketch of two separate dimensions of agent workloads, task difficulty and orchestration scale, rising toward a potential-workload zone. Below, an illustrative work budget: 8 hours times 1 worker is 8 worker-hours; 8 hours times 30 workers is 240 worker-hours; the GTG-1002 campaign reached about 30 targets, a campaign scope rather than a worker count. A work budget is not guaranteed capability.</desc>
  <defs>
    <style>text{font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',sans-serif;fill:#262b2b}.title{font-family:Georgia,'Noto Serif',serif;font-size:60px;font-weight:400;letter-spacing:-.01em}.kick{font-size:30px;font-weight:700;letter-spacing:.06em;fill:#5e625c}.head{font-size:30px;font-weight:700;letter-spacing:.06em}.b{font-size:33px}.bb{font-size:33px;font-weight:700}.l{font-size:30px;fill:#5e625c}.big{font-size:42px;font-weight:700}.num{font-family:Georgia,'Noto Serif',serif;font-size:64px;font-weight:400}.axis{font-size:30px;fill:#5e625c;font-variant-numeric:tabular-nums}.caps{font-weight:700;letter-spacing:.06em}.grid{stroke:#ddd6c8;stroke-width:1.5;stroke-dasharray:4 8}.halo{stroke:#f8f4ec;stroke-width:8;stroke-linejoin:round;paint-order:stroke}.dot{stroke:#f8f4ec;stroke-width:4}.card{fill:#fffaf2;stroke:#cec7bb;stroke-width:1.5}.inner{fill:#f8f4ec;stroke:#d8d0c2;stroke-width:1.5}.recess{fill:#efe9dd;stroke:#d8d0c2;stroke-width:1.5}</style>
  </defs>
  <rect x="1" y="1" width="998" height="1442" rx="16" fill="#f8f4ec" stroke="#cec7bb" stroke-width="2"/>
  <rect x="56" y="44" width="888" height="4" fill="#96492f"/>
  <text class="title" x="56" y="124">Two dimensions of</text>
  <text class="title" x="56" y="192">agent workloads</text>
  <line x1="56" y1="252" x2="104" y2="252" stroke="#314f5b" stroke-width="6" stroke-linecap="round"/>
  <text class="bb" x="122" y="262" style="fill:#314f5b">Task difficulty</text>
  <line x1="486" y1="252" x2="534" y2="252" stroke="#386243" stroke-width="6" stroke-dasharray="14 10" stroke-linecap="round"/>
  <text class="bb" x="552" y="262" style="fill:#386243">Orchestration scale</text>
  <rect x="644" y="310" width="300" height="390" fill="#f4ded6" opacity=".6"/>
  <line class="grid" x1="110" y1="370" x2="944" y2="370"/>
  <line class="grid" x1="110" y1="480" x2="944" y2="480"/>
  <line class="grid" x1="110" y1="590" x2="944" y2="590"/>
  <line x1="110" y1="310" x2="110" y2="700" stroke="#8d8a80" stroke-width="2"/>
  <line x1="110" y1="700" x2="944" y2="700" stroke="#8d8a80" stroke-width="2"/>
  <text class="head" x="660" y="356" style="fill:#a2392b">POTENTIAL</text>
  <text class="head" x="660" y="396" style="fill:#a2392b">WORKLOAD</text>
  <path fill="none" stroke="#314f5b" stroke-width="7" stroke-linecap="round" d="M110 692 C 380 688, 560 660, 680 590 S 860 460, 924 340"/>
  <path fill="none" stroke="#386243" stroke-width="7" stroke-dasharray="16 12" stroke-linecap="round" d="M110 696 C 330 694, 500 686, 600 660 S 800 470, 914 380"/>
  <circle class="dot" cx="924" cy="340" r="13" fill="#314f5b"/>
  <circle class="dot" cx="914" cy="380" r="13" fill="#386243"/>
  <text class="axis" x="110" y="744">Earlier</text>
  <text class="axis" x="944" y="744" text-anchor="end">Later</text>
  <text class="axis caps" x="527" y="744" text-anchor="middle">ILLUSTRATIVE</text>
  <text class="axis caps" x="0" y="0" text-anchor="middle" transform="translate(80 505.0) rotate(-90)">NO SHARED UNITS</text>
  <rect class="card" x="56" y="800" width="888" height="588" rx="14"/>
  <text class="head" x="84" y="852">ILLUSTRATIVE WORK BUDGET</text>
  <rect class="inner" x="80" y="876" width="840" height="100" rx="10"/>
  <rect x="80" y="876" width="6" height="100" rx="3" fill="#8d8a80"/>
  <text class="b" x="108" y="938">8 h × 1 worker</text>
  <text class="big" x="896" y="940" text-anchor="end" style="fill:#262b2b">8 worker-hours</text>
  <rect class="inner" x="80" y="992" width="840" height="100" rx="10"/>
  <rect x="80" y="992" width="6" height="100" rx="3" fill="#386243"/>
  <text class="b" x="108" y="1054">8 h × 30 workers</text>
  <text class="big" x="896" y="1056" text-anchor="end" style="fill:#386243">240 worker-hours</text>
  <rect class="inner" x="80" y="1108" width="840" height="140" rx="10"/>
  <rect x="80" y="1108" width="6" height="140" rx="3" fill="#a2392b"/>
  <text class="b" x="108" y="1170">GTG-1002</text>
  <text class="big" x="896" y="1172" text-anchor="end" style="fill:#a2392b">~30 targets</text>
  <text class="l" x="896" y="1220" text-anchor="end">campaign scope, not workers</text>
  <rect x="80" y="1272" width="840" height="96" rx="10" fill="#e1eadb" stroke="#9dbb96" stroke-width="1.5"/>
  <text class="bb" x="500" y="1332" text-anchor="middle" style="fill:#386243">Work budget ≠ guaranteed capability</text>
</svg>
