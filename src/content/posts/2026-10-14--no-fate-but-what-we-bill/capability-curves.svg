<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Two dimensions of agent workloads</title>
  <desc id="desc">Conceptual, undated illustration of task difficulty and orchestration scale. Human-baseline task duration is distinct from agent runtime; runtime times workers gives a work budget, not a capability law.</desc>
  <defs>
    <linearGradient id="rule" x1="0" x2="1"><stop stop-color="#00f5ee"/><stop offset=".5" stop-color="#b8ff5f"/><stop offset="1" stop-color="#ff6b9d"/></linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>text{font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#f7fbff}.title{font-size:38px;font-weight:820}.sub{font-size:17px;fill:#a7bbc6}.axis{font-size:13px;fill:#a7bbc6;font-variant-numeric:tabular-nums}.curve{fill:none;stroke-width:4;stroke-linecap:round}.land{font-size:14px;font-weight:800;fill:#dfffc0}.landp{font-size:13px;fill:#9fb3be}.prod{font-size:15px;font-weight:820;fill:#ff6b9d}.note{font-size:13.5px;fill:#91a7b2}.grid{stroke:#29404b;stroke-width:1;stroke-dasharray:3 8;shape-rendering:crispEdges}.cyan{fill:#00f5ee}.lime{fill:#b8ff5f}.pink{fill:#ff6b9d}</style>
  </defs>
  <rect width="1600" height="900" rx="24" fill="#05080b"/><rect x="32" y="28" width="1536" height="844" rx="20" fill="#0a1015" stroke="#20303a"/><rect x="32" y="28" width="1536" height="4" rx="2" fill="url(#rule)"/>
  <text class="title" x="72" y="88">Two dimensions of agent workloads</text><text class="sub" x="72" y="120">Task difficulty and orchestration scale · conceptual shapes, not measured trends or forecasts</text>
  <g>
    <line class="grid" x1="130" y1="220" x2="1000" y2="220"/><line class="grid" x1="130" y1="340" x2="1000" y2="340"/><line class="grid" x1="130" y1="460" x2="1000" y2="460"/><line class="grid" x1="130" y1="580" x2="1000" y2="580"/><line class="grid" x1="130" y1="700" x2="1000" y2="700"/>
    <line x1="130" y1="180" x2="130" y2="700" stroke="#526872"/><line x1="130" y1="700" x2="1000" y2="700" stroke="#526872"/>
    <rect x="760" y="180" width="240" height="520" fill="#ff6b9d" opacity=".07"/>
    <text class="prod" x="770" y="204">POTENTIAL WORKLOAD</text><text class="landp" x="770" y="224">more complex tasks, more workers</text><text class="landp" x="770" y="242">subject to limits and coordination</text>
    <path class="curve" stroke="#00f5ee" d="M130 692 C 340 688, 520 664, 640 610 S 860 470, 980 250"/>
    <path class="curve" stroke="#b8ff5f" stroke-dasharray="12 9" d="M130 696 C 300 694, 460 690, 560 668 S 760 560, 880 400 S 960 260, 990 220"/>
    <circle class="cyan" cx="640" cy="610" r="8" filter="url(#glow)"/><circle class="cyan" cx="980" cy="250" r="10" filter="url(#glow)"/>
    <circle class="lime" cx="880" cy="400" r="8" filter="url(#glow)"/>
    <g transform="translate(660 560)"><rect width="212" height="66" rx="10" fill="#0d171d" stroke="#00f5ee" stroke-opacity=".6"/><text class="land" x="14" y="24" fill="#b8fff5">Human-baseline time</text><text class="landp" x="14" y="46">not elapsed agent runtime</text></g>
    <g transform="translate(700 262)"><rect width="236" height="66" rx="10" fill="#0d171d" stroke="#00f5ee" stroke-opacity=".6"/><text class="land" x="14" y="24" fill="#b8fff5">Task difficulty</text><text class="landp" x="14" y="46">at a specified success rate</text></g>
    <g transform="translate(830 430)"><rect width="230" height="66" rx="10" fill="#0d171d" stroke="#b8ff5f" stroke-opacity=".6"/><text class="land" x="14" y="24" fill="#dfffc0">Orchestration scale</text><text class="landp" x="14" y="46">workers and coordination limits</text></g>
    <text class="axis" x="130" y="728" text-anchor="middle">Earlier</text><text class="axis" x="380" y="728" text-anchor="middle"> </text><text class="axis" x="640" y="728" text-anchor="middle"> </text><text class="axis" x="880" y="728" text-anchor="middle">Later</text>
    <text class="axis" x="565" y="768" text-anchor="middle" font-weight="800">CONCEPTUAL PROGRESSION · NO DATES</text>
    <text class="axis" transform="translate(100 440) rotate(-90)" text-anchor="middle" font-weight="800">SEPARATE DIMENSIONS · NO SHARED UNITS</text>
    <g transform="translate(150 320)"><circle class="cyan" cx="8" cy="8" r="7"/><text class="land" x="30" y="13" fill="#b8fff5">Task difficulty</text><text class="landp" x="30" y="33">human task time at fixed success rate</text></g>
    <g transform="translate(150 270)"><circle class="lime" cx="8" cy="8" r="7"/><text class="land" x="30" y="13" fill="#dfffc0">Orchestration scale</text><text class="landp" x="30" y="33">useful work across multiple agents</text></g>
  </g>
  <g transform="translate(1080 156)">
    <rect width="440" height="560" rx="16" fill="#0d171d" stroke="#2a3c47"/>
    <text x="24" y="36" font-size="14" font-weight="850" fill="#b5c8d1">ILLUSTRATIVE WORK BUDGET</text>
    <g transform="translate(24 78)"><rect width="392" height="118" rx="12" fill="#0a1015" stroke="#29404b"/><text class="land" x="20" y="32" fill="#f7fbff">8 hours × 1 worker = 8 worker-hours</text><text class="landp" x="20" y="56">A hypothetical allocation of runtime.</text><text class="landp" x="20" y="76">Not a METR horizon or a measured</text><text class="landp" x="20" y="96">intrusion success rate.</text></g>
    <g transform="translate(24 216)"><rect width="392" height="118" rx="12" fill="#0a1015" stroke="#b8ff5f" stroke-opacity=".55"/><text class="land" x="20" y="32" fill="#dfffc0">8 hours × 30 workers = 240 worker-hours</text><text class="landp" x="20" y="56">Assumes resources and parallel work.</text><text class="landp" x="20" y="76">Coordination overhead and correlated</text><text class="landp" x="20" y="96">failures can reduce useful output.</text></g>
    <g transform="translate(24 354)"><rect width="392" height="118" rx="12" fill="#0a1015" stroke="#ff6b9d" stroke-opacity=".55"/><text class="land" x="20" y="32" fill="#ff6b9d">GTG-1002: ~30 targets</text><text class="landp" x="20" y="56">Anthropic reported a campaign scope.</text><text class="landp" x="20" y="76">That is not a worker count, measured</text><text class="landp" x="20" y="96">concurrency, or an eight-hour run.</text></g>
    <g transform="translate(24 492)"><rect width="392" height="44" rx="10" fill="#101c18" stroke="#b8ff5f" stroke-opacity=".4"/><text class="land" x="20" y="28" fill="#dfffc0">Work budget ≠ guaranteed capability.</text></g>
  </g>
  <g transform="translate(72 772)"><rect width="1456" height="66" rx="14" fill="#0d171d" stroke="#2a3c47"/><text x="22" y="28" font-size="15" font-weight="820" fill="#dfffc0">More capable tasks and wider orchestration can increase attacker workload capacity.</text><text class="note" x="22" y="50">Sources: METR human-baseline task horizons; Anthropic GTG-1002 campaign report. No measured breadth doubling rate is implied.</text></g>
  <text class="note" x="72" y="876">No Fate But What We Bill · figure 1 · task difficulty and orchestration scale</text>
</svg>
