<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1466" role="img" aria-labelledby="title desc">
  <title id="title">The odds of a swarm</title>
  <desc id="desc">Illustrative chart of P(at least one success) = 1 − (1 − p)^n for independent attempts on a log scale from 1 to 1000 attempts. With p = 1%, 100 attempts give 63%; p = 0.5% over 300 attempts gives 78%; p = 0.1% over 1000 attempts gives 63%. Failure is per attempt, success is per swarm: attacker cost can be shifted while defender triage burden varies. Defenses lower p and cap n.</desc>
