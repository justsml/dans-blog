<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1396" role="img" aria-labelledby="title desc">
  <title id="title">Who pays</title>
  <desc id="desc">Vertical flow: an attacker with stolen cloud credentials uses the victim's cloud account, which runs the permitted models, and the charges are billed to the victim. Sysdig's 2024 worst-case scenarios put that at about $46k to over $100k per day. Scoped permissions, usage quotas, abuse detection, and credential revocation still matter.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#7a7c74"/></marker>
    <marker id="arrowVerm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#a2392b"/></marker>
    <style>text{font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',sans-serif;fill:#262b2b}.title{font-family:Georgia,'Noto Serif',serif;font-size:60px;font-weight:400;letter-spacing:-.01em}.kick{font-size:30px;font-weight:700;letter-spacing:.06em;fill:#5e625c}.head{font-size:30px;font-weight:700;letter-spacing:.06em}.b{font-size:33px}.bb{font-size:33px;font-weight:700}.l{font-size:30px;fill:#5e625c}.big{font-size:42px;font-weight:700}.num{font-family:Georgia,'Noto Serif',serif;font-size:64px;font-weight:400}.axis{font-size:30px;fill:#5e625c;font-variant-numeric:tabular-nums}.caps{font-weight:700;letter-spacing:.06em}.grid{stroke:#ddd6c8;stroke-width:1.5;stroke-dasharray:4 8}.halo{stroke:#f8f4ec;stroke-width:8;stroke-linejoin:round;paint-order:stroke}.dot{stroke:#f8f4ec;stroke-width:4}.card{fill:#fffaf2;stroke:#cec7bb;stroke-width:1.5}.inner{fill:#f8f4ec;stroke:#d8d0c2;stroke-width:1.5}.recess{fill:#efe9dd;stroke:#d8d0c2;stroke-width:1.5}</style>
  </defs>
  <rect x="1" y="1" width="998" height="1394" rx="16" fill="#f8f4ec" stroke="#cec7bb" stroke-width="2"/>
  <rect x="56" y="44" width="888" height="4" fill="#96492f"/>
  <text class="title" x="56" y="124">Who pays</text>
  <text class="kick" x="56" y="178">LLMJACKING</text>
  <rect class="card" x="56" y="220" width="888" height="150" rx="14"/>
  <rect x="56" y="220" width="888" height="6" rx="3" fill="#a2392b"/>
  <text class="head" x="88" y="278" style="fill:#a2392b">ATTACKER</text>
  <text class="big" x="88" y="336">Stolen cloud credentials</text>
  <line x1="176" y1="370" x2="176" y2="450" stroke="#7a7c74" stroke-width="4" marker-end="url(#arrow)"/>
  <text class="b" x="204" y="423" style="fill:#5e625c">uses</text>
  <rect class="card" x="56" y="454" width="888" height="150" rx="14"/>
  <rect x="56" y="454" width="888" height="6" rx="3" fill="#314f5b"/>
  <text class="head" x="88" y="512" style="fill:#314f5b">VICTIM'S CLOUD ACCOUNT</text>
  <text class="big" x="88" y="570">Meter running</text>
  <line x1="176" y1="604" x2="176" y2="684" stroke="#7a7c74" stroke-width="4" marker-end="url(#arrow)"/>
  <text class="b" x="204" y="657" style="fill:#5e625c">runs</text>
  <rect class="card" x="56" y="688" width="888" height="150" rx="14"/>
  <rect x="56" y="688" width="888" height="6" rx="3" fill="#386243"/>
  <text class="head" x="88" y="746" style="fill:#386243">CAPABILITY</text>
  <text class="big" x="88" y="804">Permitted models</text>
  <line x1="176" y1="838" x2="176" y2="918" stroke="#a2392b" stroke-width="4" marker-end="url(#arrowVerm)"/>
  <text class="bb" x="204" y="891" style="fill:#a2392b">bills</text>
  <rect x="56" y="922" width="888" height="190" rx="14" fill="#f4ded6" stroke="#d39a8d" stroke-width="1.5"/>
  <rect x="56" y="922" width="888" height="6" rx="3" fill="#a2392b"/>
  <text class="head" x="88" y="980" style="fill:#a2392b">THE VICTIM'S BILL</text>
  <text class="big" x="88" y="1042" style="fill:#a2392b">~$46k → $100k+ / day</text>
  <text class="l" x="88" y="1086" style="fill:#262b2b">Sysdig's 2024 worst-case scenarios</text>
  <rect class="recess" x="56" y="1144" width="888" height="196" rx="14"/>
  <text class="head" x="88" y="1200">CONTROLS STILL MATTER</text>
  <circle cx="96" cy="1245" r="7" fill="#314f5b"/>
  <text class="b" x="116" y="1256">Scoped permissions</text>
  <circle cx="536" cy="1245" r="7" fill="#314f5b"/>
  <text class="b" x="556" y="1256">Usage quotas</text>
  <circle cx="96" cy="1295" r="7" fill="#314f5b"/>
  <text class="b" x="116" y="1306">Abuse detection</text>
  <circle cx="536" cy="1295" r="7" fill="#314f5b"/>
  <text class="b" x="556" y="1306">Credential revocation</text>
</svg>
